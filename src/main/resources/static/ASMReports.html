<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASM Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/asm-common.css">

<style>
.rank-badge{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  background:#eaf1ff;
  color:#0d6efd;
}

.rank-1{
  background:#facc15;
  color:#111827;
}

.summary-value{
  font-size:24px;
  font-weight:900;
  color:#0d6efd;
}
</style>
</head>

<body>

<div class="asm-container">

  <div class="asm-card">
    <h4 class="fw-bold mb-3">Performance Summary</h4>

    <div class="row g-3">
      <div class="col-6 col-md-3">
        <div class="asm-feature-card">
          <div class="asm-icon-box"><i class="fa-solid fa-users"></i></div>
          <h5>Total MRs</h5>
          <div class="count" id="totalMrs">0</div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="asm-feature-card">
          <div class="asm-icon-box" style="color:#16a34a"><i class="fa-solid fa-indian-rupee-sign"></i></div>
          <h5>Sales</h5>
          <div class="count" id="totalSales">₹0</div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="asm-feature-card">
          <div class="asm-icon-box" style="color:#0d6efd"><i class="fa-solid fa-wallet"></i></div>
          <h5>Collection</h5>
          <div class="count" id="totalCollection">₹0</div>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="asm-feature-card">
          <div class="asm-icon-box" style="color:#ef4444"><i class="fa-solid fa-chart-pie"></i></div>
          <h5>Due</h5>
          <div class="count" id="totalDue">₹0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="asm-card">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h4 class="fw-bold mb-0">Team Leaderboard</h4>

      <div class="d-flex gap-2">
        <!-- <button class="btn btn-outline-success btn-sm" onclick="alert('Excel export baad me add karenge')">
          <i class="fa-solid fa-file-excel me-1"></i>Excel
        </button> -->

        <button class="btn btn-outline-danger btn-sm" onclick="alert('PDF export add later')">
          <i class="fa-solid fa-file-pdf me-1"></i>PDF
        </button>
      </div>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <input type="text" id="searchInput" class="form-control" placeholder="Search MR or HQ..." onkeyup="filterReports()">
      </div>

      <div class="col-6 col-md-4">
        <select id="hqFilter" class="form-select" onchange="filterReports()">
          <option value="">All HQ</option>
        </select>
      </div>

      <div class="col-6 col-md-4">
        <select id="sortBy" class="form-select" onchange="filterReports()">
          <option value="sales">Sort by Sales</option>
          <option value="collection">Sort by Collection</option>
          <option value="orders">Sort by Orders</option>
          <option value="visits">Sort by Visits</option>
          <option value="due">Sort by Due</option>
          <option value="expense">Sort by Expense</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-light">
          <tr>
            <th>Rank</th>
            <th>MR</th>
            <th>HQ</th>
            <th>Sales</th>
            <th>Collection</th>
            <th>Due</th>
            <th>Orders</th>
            <th>Visits</th>
            <th>Expense</th>
          </tr>
        </thead>

        <tbody id="leaderboardTable">
          <tr>
            <td colspan="9" class="text-center text-muted">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/asm-common.js"></script>

<script>
if (checkAsmSession()) {
  renderAsmSidebar("reports");
  renderAsmHeader("ASM Reports", true, "ASMDashboard.html");
}

const asmId = getAsmId();
let leaderboardData = [];

window.onload = function(){
  loadLeaderboard();
};

function loadLeaderboard(){
  fetch(`${BASE_URL}/asm/dashboard-fast/${asmId}`)
    .then(res => res.json())
    .then(data => {
      leaderboardData = data.leaderboard || [];
      loadHqFilter();
      updateSummary(leaderboardData);
      renderLeaderboard(leaderboardData);
    })
    .catch(err => {
      console.error(err);
      alert("Failed to load reports");
    });
}

function updateSummary(data){
  let sales = 0;
  let collection = 0;
  let due = 0;

  data.forEach(row => {
    sales += Number(row.sales || 0);
    collection += Number(row.collection || 0);
    due += Number(row.due || 0);
  });

  setText("totalMrs", data.length);
  setText("totalSales", money(sales));
  setText("totalCollection", money(collection));
  setText("totalDue", money(due));
}

function loadHqFilter(){
  const filter = document.getElementById("hqFilter");
  filter.innerHTML = `<option value="">All HQ</option>`;

  const hqs = [...new Set(leaderboardData.map(r => r.headquarters).filter(Boolean))];

  hqs.forEach(hq => {
    filter.innerHTML += `<option value="${hq}">${hq}</option>`;
  });
}

function renderLeaderboard(data){
  const table = document.getElementById("leaderboardTable");
  table.innerHTML = "";

  if(!data || data.length === 0){
    table.innerHTML = `
      <tr>
        <td colspan="9" class="text-center text-muted">No report data found</td>
      </tr>
    `;
    return;
  }

  data.forEach((row, index) => {
    const rank = index + 1;

    table.innerHTML += `
      <tr onclick="openEmployee(${row.employeeId})" style="cursor:pointer">
        <td>
          <div class="rank-badge ${rank === 1 ? 'rank-1' : ''}">
            ${rank}
          </div>
        </td>

        <td><strong>${row.employeeName || "-"}</strong></td>
        <td><span class="asm-badge">${row.headquarters || "-"}</span></td>
        <td>${money(row.sales)}</td>
        <td>${money(row.collection)}</td>
        <td>${money(row.due)}</td>
        <td>${row.orders || 0}</td>
        <td>${row.visits || 0}</td>
        <td>${money(row.expense)}</td>
      </tr>
    `;
  });
}

function filterReports(){
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  const hq = document.getElementById("hqFilter").value;
  const sortBy = document.getElementById("sortBy").value;

  let filtered = leaderboardData.filter(row => {
    const text = `${row.employeeName || ""} ${row.headquarters || ""}`.toLowerCase();
    const matchText = text.includes(keyword);
    const matchHq = !hq || row.headquarters === hq;

    return matchText && matchHq;
  });

  filtered.sort((a,b) => Number(b[sortBy] || 0) - Number(a[sortBy] || 0));

  updateSummary(filtered);
  renderLeaderboard(filtered);
}

function openEmployee(id){
  localStorage.setItem("selectedEmployeeId", id);
  window.location.href = "ASMEmployeeDetails.html";
}
</script>

</body>
</html>
