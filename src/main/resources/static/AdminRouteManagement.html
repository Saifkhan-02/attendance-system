<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{background:#f4f6fb}

.top-header{
  background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
  color:white;
  padding:25px;
  border-radius:0 0 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.admin-card,.summary-card{
  border:none;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,.form-select{
  border-radius:12px;
  padding:12px;
}

.summary-icon{
  width:48px;height:48px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  margin:auto;font-size:22px;
}

.icon-blue{background:#e9f2ff;color:#0d6efd}
.icon-green{background:#eafaf1;color:#198754}
.icon-orange{background:#fff4e5;color:#fd7e14}

.status-active{color:#198754;font-weight:700}
.status-inactive{color:#dc3545;font-weight:700}

.table td{vertical-align:middle}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <h2 class="fw-bold mb-1">Route Management</h2>
      <p class="mb-0">Create HQ-wise routes for monthly tour planning</p>
    </div>

    <a href="admin-dashboard.html" class="btn btn-light fw-semibold">
      <i class="fa-solid fa-arrow-left me-2"></i> Dashboard
    </a>
  </div>
</div>

<div class="container py-4">

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="summary-icon icon-blue mb-2">
            <i class="fa-solid fa-route"></i>
          </div>
          <h6 class="text-muted">Total Routes</h6>
          <h3 class="fw-bold" id="totalRoutes">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="summary-icon icon-green mb-2">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <h6 class="text-muted">Active Routes</h6>
          <h3 class="fw-bold" id="activeRoutes">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="summary-icon icon-orange mb-2">
            <i class="fa-solid fa-map-location-dot"></i>
          </div>
          <h6 class="text-muted">Headquarters</h6>
          <h3 class="fw-bold" id="totalHQ">0</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="card admin-card mb-4">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-4">
        <i class="fa-solid fa-plus me-2 text-primary"></i>
        Add / Edit Route
      </h5>

      <input type="hidden" id="editRouteId">

      <div class="row g-3">

        <div class="col-md-4">
          <label class="form-label">Headquarter</label>
          <select id="headquarterName" class="form-select">
            <option value="">Select Headquarter</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Route / Activity Name</label>
          <input type="text" id="routeName" class="form-control" placeholder="Example: Gola">
        </div>

        <div class="col-md-2">
          <label class="form-label">Distance KM</label>
          <input type="number" id="distanceKm" class="form-control" placeholder="0">
        </div>

        <div class="col-md-2">
          <label class="form-label">Route Type</label>
          <select id="routeType" class="form-select">
            <option value="Field Route">Field Route</option>
            <option value="Activity">Activity</option>
          </select>
        </div>

        <div class="col-md-12 d-flex gap-2 flex-wrap">
          <button class="btn btn-primary px-4" onclick="saveRoute()">
            <i class="fa-solid fa-floppy-disk me-2"></i>
            Save Route
          </button>

          <button class="btn btn-secondary px-4" onclick="clearForm()">
            <i class="fa-solid fa-rotate-left me-2"></i>
            Clear
          </button>
        </div>

      </div>
    </div>
  </div>

  <div class="card admin-card">
    <div class="card-body p-4">

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h5 class="fw-bold mb-0">
          <i class="fa-solid fa-list me-2 text-primary"></i>
          Route List
        </h5>

        <div class="d-flex gap-2 flex-wrap">
          <select id="filterHQ" class="form-select" style="width:220px" onchange="renderRouteTable()">
            <option value="">All Headquarters</option>
          </select>

          <input type="text"
                 id="searchRoute"
                 class="form-control"
                 style="width:220px"
                 placeholder="Search route..."
                 oninput="renderRouteTable()">
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-primary">
            <tr>
              <th>Headquarter</th>
              <th>Route / Activity</th>
              <th>Distance KM</th>
              <th>Fare @ ₹2/KM</th>
              <th>Type</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="routeTable"></tbody>
        </table>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>
let routeList = [];
let hqList = [];
const KM_RATE = 2;

window.onload = function () {
  loadHeadquarters();
  loadRoutes();
};

function loadHeadquarters() {
  fetch(`${BASE_URL}/headquarter/active`)
    .then(res => res.json())
    .then(data => {
      hqList = data || [];

      document.getElementById("totalHQ").innerText = hqList.length;

      const hqDropdown = document.getElementById("headquarterName");
      const filterDropdown = document.getElementById("filterHQ");

      hqDropdown.innerHTML = `<option value="">Select Headquarter</option>`;
      filterDropdown.innerHTML = `<option value="">All Headquarters</option>`;

      hqList.forEach(hq => {
        hqDropdown.innerHTML += `
          <option value="${hq.headquarterName}">
            ${hq.headquarterName}
          </option>
        `;

        filterDropdown.innerHTML += `
          <option value="${hq.headquarterName}">
            ${hq.headquarterName}
          </option>
        `;
      });
    })
    .catch(error => {
      console.error(error);
      alert("Failed to load headquarters");
    });
}

function loadRoutes() {
  fetch(`${BASE_URL}/route-master/all`)
    .then(res => res.json())
    .then(data => {
      routeList = data || [];
      updateSummary();
      renderRouteTable();
    })
    .catch(error => {
      console.error(error);
      alert("Failed to load routes");
    });
}

function saveRoute() {
  const editId = document.getElementById("editRouteId").value;

  const headquarterName = document.getElementById("headquarterName").value;
  const routeName = document.getElementById("routeName").value.trim();
  const distanceKm = Number(document.getElementById("distanceKm").value || 0);
  const routeType = document.getElementById("routeType").value;

  if (!headquarterName) {
    alert("Please select headquarter");
    return;
  }

  if (!routeName) {
    alert("Please enter route name");
    return;
  }

  const payload = {
    headquarterName,
    routeName,
    distanceKm,
    routeType,
    status: "Active"
  };

  const url = editId
    ? `${BASE_URL}/route-master/update/${editId}`
    : `${BASE_URL}/route-master/save`;

  const method = editId ? "PUT" : "POST";

  fetch(url, {
    method,
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  })
  .then(async response => {
    const text = await response.text();

    if (!response.ok) {
      throw new Error(text);
    }

    alert(editId ? "Route Updated Successfully" : "Route Added Successfully");

    clearForm();
    loadRoutes();
  })
  .catch(error => {
    console.error(error);
    alert("Failed to save route");
  });
}

function renderRouteTable() {
  const table = document.getElementById("routeTable");
  const search = document.getElementById("searchRoute").value.toLowerCase().trim();
  const selectedHQ = document.getElementById("filterHQ").value;

  table.innerHTML = "";

  let filtered = routeList.filter(route => {
    const matchesSearch =
      !search ||
      (route.routeName || "").toLowerCase().includes(search) ||
      (route.headquarterName || "").toLowerCase().includes(search);

    const matchesHQ =
      !selectedHQ || route.headquarterName === selectedHQ;

    return matchesSearch && matchesHQ;
  });

  if (filtered.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="7" class="text-center">No routes found</td>
      </tr>
    `;
    return;
  }

  filtered.forEach(route => {
    const status = route.status || "Active";
    const statusClass = status === "Active" ? "status-active" : "status-inactive";
    const fare = Number(route.distanceKm || 0) * KM_RATE;

    table.innerHTML += `
      <tr>
        <td>${route.headquarterName || "-"}</td>
        <td class="fw-semibold">${route.routeName || "-"}</td>
        <td>${route.distanceKm || 0}</td>
        <td>₹${fare.toLocaleString("en-IN")}</td>
        <td>${route.routeType || "-"}</td>
        <td><span class="${statusClass}">${status}</span></td>
        <td>
          <button class="btn btn-sm btn-primary me-1"
                  onclick='editRoute(${JSON.stringify(route)})'>
            <i class="fa-solid fa-pen"></i>
          </button>

          <button class="btn btn-sm ${
            status === "Active" ? "btn-danger" : "btn-success"
          }" onclick="toggleRouteStatus(${route.id})">
            <i class="fa-solid ${
              status === "Active" ? "fa-ban" : "fa-check"
            }"></i>
          </button>
        </td>
      </tr>
    `;
  });
}

function editRoute(route) {
  document.getElementById("editRouteId").value = route.id;
  document.getElementById("headquarterName").value = route.headquarterName || "";
  document.getElementById("routeName").value = route.routeName || "";
  document.getElementById("distanceKm").value = route.distanceKm || 0;
  document.getElementById("routeType").value = route.routeType || "Field Route";

  window.scrollTo({top:0, behavior:"smooth"});
}

function toggleRouteStatus(id) {
  fetch(`${BASE_URL}/route-master/toggle-status/${id}`, {
    method: "PUT"
  })
  .then(response => {
    if (!response.ok) {
      throw new Error("Failed");
    }

    loadRoutes();
  })
  .catch(error => {
    console.error(error);
    alert("Failed to update status");
  });
}

function clearForm() {
  document.getElementById("editRouteId").value = "";
  //document.getElementById("headquarterName").value = "";
  document.getElementById("routeName").value = "";
  document.getElementById("distanceKm").value = "";
  document.getElementById("routeType").value = "Field Route";
}

function updateSummary() {
  document.getElementById("totalRoutes").innerText = routeList.length;

  const activeCount = routeList.filter(r => (r.status || "Active") === "Active").length;
  document.getElementById("activeRoutes").innerText = activeCount;
}
</script>

</body>
</html>
