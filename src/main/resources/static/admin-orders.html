          function goBack() {

   window.onload = async function () {

    const today = new Date();

     // Report Date set

    await loadEmployees();

      function toggleSidebar() {
        let sidebar = document.getElementById("sidebar");

        let main = document.getElementById("mainContent");

        if (window.innerWidth <= 768) {
          sidebar.classList.toggle("show");
        } else {
          sidebar.classList.toggle("hide");

          main.classList.toggle("full");
        }
      }

      function updateTime() {
        document.getElementById("datetime").innerHTML =

      async function loadEmployees() {

    const response =
        await fetch(`${BASE_URL}/admin/employees`);

    const employees =
        await response.json();

    let options =
        '<option value="">All Employees</option>';

    employees.forEach(emp => {

        options += `
            <option value="${emp.id}">
                ${emp.name}
            </option>
        `;

    });


    document.getElementById(
        "summaryEmployee"
    ).innerHTML = options;

}

let grouped = {};

let currentPage = 0;
let totalPages = 0;
let totalElements = 0;
      
async function loadOrders() {

    grouped = {};

    const response =
        await fetch(`${BASE_URL}/order/all`);
    const orders =
        await response.json();

orders.forEach(order => {

    const key = order.invoiceNo || order.id;

    if (!grouped[key]) {

      grouped[key] = {
    id: order.id,
    employeeId: order.employeeId,
    invoiceNo: order.invoiceNo,
    employeeName: order.employeeName,
    doctorName: order.doctorName,
    area: order.area,
    orderDate: order.orderDate,
    orderTime: order.orderTime,
    paidAmount: 0,
    dueAmount: 0,
    totalAmount: 0,
    products: [],
    productHtml: ""
};

    }

    grouped[key].products.push(order);

    grouped[key].productHtml =
(grouped[key].productHtml || "") +

`
<div class="border rounded p-2 mb-2">

<b>${order.productName}</b><br>

Qty : ${order.orderQuantity}

&nbsp;&nbsp;&nbsp;

Price : ₹${order.sellingPrice || 0}

&nbsp;&nbsp;&nbsp;

Amount : ₹${order.orderAmount || 0}

</div>
`;

    grouped[key].totalAmount += Number(order.orderAmount || 0);

    grouped[key].paidAmount += Number(order.paidAmount || 0);

    grouped[key].dueAmount += Number(order.dueAmount || 0);

});

    let html = '';
   Object.values(grouped).forEach((order, index) => {

html += `

<tr>

<td>${currentPage * 20 + index + 1}</td>

<td>${order.employeeName}</td>

<td>${order.doctorName}</td>

<td>${order.area || "-"}</td>

<td>

<button
class="btn btn-primary btn-sm"
onclick="toggleProducts('${order.invoiceNo}')">

View (${order.products.length})

</button>

</td>

<td>₹${order.totalAmount.toFixed(2)}</td>

<td>₹${order.paidAmount.toFixed(2)}</td>

<td>₹${order.dueAmount.toFixed(2)}</td>

<td>${order.orderDate}</td>

<td>${order.orderTime || "-"}</td>

</tr>

<tr
id="products-${order.invoiceNo}"
style="display:none;">

<td colspan="10">

<div id="productsBody-${order.invoiceNo}"></div>

</td>

</tr>

`;

});

    document.getElementById(
        'ordersTableBody'
    ).innerHTML = html;
}
async function loadSummary() {

    const employeeId =
        document.getElementById("summaryEmployee").value;

   const date =
document.getElementById("reportDate").value;

let url =
`${BASE_URL}/order/summary`;

const params = [];

if (date) {
    params.push(`date=${date}`);
}

if (employeeId) {
    params.push(`employeeId=${employeeId}`);
}

if (params.length > 0) {
    url += "?" + params.join("&");
}

    const response = await fetch(url);

    const data = await response.json();

    document.getElementById("totalOrders").innerText = data.totalOrders;
    document.getElementById("totalAmount").innerText = "₹" + data.totalAmount;
    document.getElementById("paidAmount").innerText = "₹" + data.paidAmount;
    document.getElementById("dueAmount").innerText = "₹" + data.dueAmount;
}

async function searchOrders() {

    
    const employeeId =
        document.getElementById("summaryEmployee").value;

    const date =
document.getElementById("reportDate").value;

let url =`${BASE_URL}/order/search`;

const params = [];

if (date) {
    params.push(`date=${date}`);
}

if (employeeId) {
    params.push(`employeeId=${employeeId}`);
}

params.push("page=" + currentPage);
params.push("size=20");

if (params.length > 0) {
    url += "?" + params.join("&");
}

const response = await fetch(url);

const pageData = await response.json();

const orders = pageData.content;

console.log(pageData);
console.log(orders);

totalPages = pageData.totalPages;
totalElements = pageData.totalElements;
currentPage = pageData.number;

        grouped = {};

    let html = "";

    orders.forEach(order => {

    const key = order.invoiceNo || order.id;

    if (!grouped[key]) {

        grouped[key] = {
            id: order.id,
            employeeId: order.employeeId,
            invoiceNo: order.invoiceNo,
            employeeName: order.employeeName,
            doctorName: order.doctorName,
            area: order.area,
            orderDate: order.orderDate,
            orderTime: order.orderTime,
            paidAmount: 0,
            dueAmount: 0,
            totalAmount: 0,
            products: [],
            productHtml: ""
        };

    }

    grouped[key].products.push(order);

    grouped[key].totalAmount += Number(order.orderAmount || 0);
    grouped[key].paidAmount += Number(order.paidAmount || 0);
    grouped[key].dueAmount += Number(order.dueAmount || 0);

    grouped[key].productHtml += `
<div class="border rounded p-2 mb-2">
<b>${order.productName}</b><br>
Qty : ${order.orderQuantity}
&nbsp;&nbsp;
Price : ₹${order.sellingPrice || 0}
&nbsp;&nbsp;
Amount : ₹${order.orderAmount || 0}
</div>`;
});

   Object.values(grouped).forEach((order, index) => {

       html += `
<tr>
    
<td>${currentPage * 20 + index + 1}</td>

<td>${order.employeeName}</td>

<td>${order.doctorName}</td>

<td>${order.area || ""}</td>

<td>

<button
class="btn btn-primary btn-sm"
onclick="toggleProducts('${order.invoiceNo}')">

View (${order.products.length})

</button>

</td>

<td>₹${order.totalAmount.toFixed(2)}</td>

<td>₹${order.paidAmount.toFixed(2)}</td>

<td>₹${order.dueAmount.toFixed(2)}</td>

<td>${order.orderDate}</td>

<td>${order.orderTime || "-"}</td>

</tr>

<tr
id="products-${order.invoiceNo}"
style="display:none;">

<td colspan="10">

<div id="productsBody-${order.invoiceNo}"></div>

</td>

</tr>
`;

    });

    document.getElementById(
        "ordersTableBody"
    ).innerHTML = html;

    const start =
    totalElements === 0
        ? 0
        : currentPage * 20 + 1;

const end =
    Math.min(
        (currentPage + 1) * 20,
        totalElements
    );

document.getElementById("paginationInfo").innerText =
    `Showing ${start}-${end} of ${totalElements} Orders`;

document.getElementById("pageNumber").innerText =
    currentPage + 1;

document.getElementById("prevBtn").disabled =
    currentPage === 0;

document.getElementById("nextBtn").disabled =
    currentPage >= totalPages - 1;

}
function toggleProducts(invoiceNo) {

    const row = document.getElementById("products-" + invoiceNo);

    const body = document.getElementById("productsBody-" + invoiceNo);

    const order = Object.values(grouped)
        .find(x => x.invoiceNo === invoiceNo);

    if (!order) {
        return;
    }

    body.innerHTML = order.productHtml;

    if (row.style.display === "none") {
        row.style.display = "table-row";
    } else {
        row.style.display = "none";
    }
}

// ================= SINGLE BILL PDF DOWNLOAD =================


function resetSummary() {

    // Employee Reset
    document.getElementById("summaryEmployee").value = "";

    // Download Button Disable
    document.getElementById("downloadReportBtn").disabled = true;

    // Date Filter Remove
    document.getElementById("reportDate").value = "";

    currentPage = 0;

    // Load All Data
    loadSummary();

    searchOrders();

}

document.getElementById("reportDate")
.addEventListener("change", function () {

    const parts = this.value.split("-");

    document.getElementById("yearFilter").value = parts[0];
    document.getElementById("monthFilter").value = parts[1];

    loadSummary();

    searchOrders();

});

// ================= EMPLOYEE DAILY REPORT PDF DOWNLOAD =================

async function downloadEmployeeReport() {

    const employeeId =
        document.getElementById("summaryEmployee").value;

    if (!employeeId) {
        alert("Please select employee");
        return;
    }

    const date =
        document.getElementById("reportDate").value;

    if (!date) {
        alert("Please select report date");
        return;
    }

    const url =
        `${BASE_URL}/order/employee-report?employeeId=${employeeId}&date=${date}`;

    try {

        const response = await fetch(url);

        if (response.status === 204) {

            alert("No orders found for selected date.");
            return;

        }

        if (!response.ok) {

            alert("Unable to download report.");
            return;

        }

        const blob = await response.blob();

        const fileURL = window.URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = fileURL;
        a.download = `Employee_Report_${employeeId}_${date}.pdf`;

        document.body.appendChild(a);

        a.click();

        a.remove();

        window.URL.revokeObjectURL(fileURL);

    } catch (error) {

        console.error(error);

        alert("Something went wrong while downloading report.");

    }

}

function employeeChanged() {

    currentPage = 0;

    loadSummary();

    searchOrders();

    toggleReportButton();

}

function toggleReportButton() {

    const employeeId =
        document.getElementById("summaryEmployee").value;

    document.getElementById("downloadReportBtn").disabled =
        employeeId === "";

}

function previousPage() {

    if (currentPage > 0) {

        currentPage--;

        searchOrders();

    }

}

function nextPage() {

    if (currentPage < totalPages - 1) {

        currentPage++;

        searchOrders();

    }

}

</script>
