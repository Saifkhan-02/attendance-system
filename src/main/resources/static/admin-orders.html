<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
<style>
body{
  background:#f4f6fb;
}

.top-header{
  background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
  color:white;
  padding:22px;
  border-radius:0 0 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.main-card,
.summary-card{
  border:none;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon-box{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:23px;
}

.bg-order{background:#dbeafe;color:#2563eb}
.bg-sale{background:#dcfce7;color:#16a34a}
.bg-paid{background:#e0f2fe;color:#0284c7}
.bg-due{background:#fee2e2;color:#dc2626}

.form-control,
.form-select{
  border-radius:12px;
  padding:11px;
}

.table-scroll{
  max-height:520px;
  overflow:auto;
}

.table-scroll thead th{
  position:sticky;
  top:0;
  z-index:5;
  background:#0d6efd!important;
  color:white!important;
}

th,td{
  white-space:nowrap;
  vertical-align:middle;
}

.amount-success{
  color:#198754;
  font-weight:800;
}

.amount-danger{
  color:#dc3545;
  font-weight:800;
}

@media(max-width:768px){
  h2{font-size:22px}
}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">
    <button class="back-btn" onclick="window.location.href='admin-dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">
        <i class="fa-solid fa-box me-2"></i>
        Orders Management
      </h2>
      <p class="mb-0">Today orders and employee-wise monthly order history</p>
    </div>

    <div style="width:42px"></div>
  </div>
</div>

<div class="container py-4">

  <div class="card main-card mb-4">
    <div class="card main-card mb-4">
  <div class="card-body p-4">

    <h4 class="fw-bold mb-3">
      <i class="fa-solid fa-search me-2 text-primary"></i>
      Search Orders
    </h4>

    <div class="row g-3">

      <div class="col-md-12">
        <input type="text"
               id="doctorFilter"
               class="form-control"
               placeholder="Search Doctor Name">
      </div>

      <div class="col-6 col-md-6">
        <label class="form-label fw-semibold">
          Employee
        </label>

        <select id="employeeFilter"
                class="form-select"
                >
                
          <option value="">
            All Employees
          </option>

        </select>
      </div>

      <div class="col-6 col-md-6">
        <label class="form-label fw-semibold">
          Date / Month
        </label>

        <input type="date"
               id="dateFilter"
               class="form-control">
      </div>

      <div class="col-md-12">
        <button class="btn btn-primary w-100"
                onclick="searchOrders()">

          <i class="fa-solid fa-magnifying-glass me-2"></i>
          Search Orders

        </button>
      </div>

    </div>

  </div>
</div>

  <div class="row g-3 mb-4">

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-order mb-2">
            <i class="fa-solid fa-box"></i>
          </div>
          <h6>Total Orders</h6>
          <h3 id="totalOrders">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-sale mb-2">
            <i class="fa-solid fa-indian-rupee-sign"></i>
          </div>
          <h6>Total Sale</h6>
          <h3 id="totalAmount">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-paid mb-2">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <h6>Paid Amount</h6>
          <h3 id="paidAmount">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-due mb-2">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <h6>Due Amount</h6>
          <h3 id="dueAmount">₹0</h3>
        </div>
      </div>
    </div>

  </div>

  <div class="card main-card">
    <div class="card-body p-4">

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h4 class="fw-bold mb-0">
          <i class="fa-solid fa-list me-2 text-primary"></i>
          <span id="tableTitle"> Orders List</span>
        </h4>

        <button class="btn btn-outline-primary btn-sm" onclick="loadOrders()">
          <i class="fa-solid fa-rotate-right me-2"></i>
          Refresh
        </button>
      </div>

      <div class="table-scroll">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>S.No</th>
              <th>Date</th>
              <th>Employee</th>
              <th>Doctor</th>
              <th>Distributor</th>
              <th>HQ</th>
              <th>Product</th>
              <th>Qty</th>
              <th>Sale</th>
              <th>Paid</th>
              <th>Due</th>
              <th>Payment</th>
              
              <th>Remarks</th>
              <th>Bill</th>
            </tr>
          </thead>

          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="js/config.js"></script>

<script>
let allOrders = [];
let employeeList = [];
let employeeChoices = null;
window.onload = function () {
 const today = new Date().toISOString().split("T")[0];

document.getElementById("dateFilter").value = today;
  loadEmployees();
  loadOrders();
};
function loadEmployees() {
  fetch(`${BASE_URL}/get-employees`)
    .then(res => res.json())
    .then(data => {
      const dropdown = document.getElementById("employeeFilter");

      dropdown.innerHTML = `<option value="ALL">All Employees</option>`;

      (data || []).forEach(emp => {
        dropdown.innerHTML += `
          <option value="${emp.id}">
            ${emp.name}
          </option>
        `;
      });

      if (employeeChoices) {
        employeeChoices.destroy();
      }

      employeeChoices = new Choices("#employeeFilter", {
        searchEnabled: true,
        itemSelectText: "",
        shouldSort: false
      });
    });
}

function loadOrders() {
  fetch(`${BASE_URL}/order/admin/all`)
    .then(res => res.json())
    .then(data => {
      allOrders = data || [];
      searchOrders();
    })
    .catch(error => {
      console.error(error);
      alert("Failed to load orders");
    });
}

function searchOrders() {

    const employeeId =
        document.getElementById("employeeFilter").value;

    const selectedDate =
        document.getElementById("dateFilter").value;

    const doctorText =
        document.getElementById("doctorFilter")
        .value
        .toLowerCase();

    let filtered = allOrders.filter(order => {

       const employeeMatch =
  employeeId === "ALL" ||
  !employeeId ||
  String(order.employeeId) === String(employeeId);

        const dateMatch =
            !selectedDate ||
            order.orderDate === selectedDate;

        const doctorMatch =
            !doctorText ||
            (order.doctorName || "")
            .toLowerCase()
            .includes(doctorText);

        return employeeMatch &&
               dateMatch &&
               doctorMatch;
    });

    renderSummary(filtered);
    renderOrders(filtered);
}

function renderSummary(data) {
  const totalSale = data.reduce((sum,o) => sum + Number(o.orderAmount || 0), 0);
  const paid = data.reduce((sum,o) => sum + Number(o.paidAmount || 0), 0);
  const due = data.reduce((sum,o) => sum + Number(o.dueAmount || 0), 0);

  document.getElementById("totalOrders").innerText = data.length;
  document.getElementById("totalAmount").innerText = formatRupees(totalSale);
  document.getElementById("paidAmount").innerText = formatRupees(paid);
  document.getElementById("dueAmount").innerText = formatRupees(due);
}

function renderOrders(data) {
  const table = document.getElementById("ordersTableBody");
  table.innerHTML = "";

  if (!data || data.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="14" class="text-center">
          No orders found
        </td>
      </tr>
    `;
    return;
  }

  data.forEach((order,index) => {
    table.innerHTML += `
      <tr>
        <td>${index + 1}</td>
         <td>${order.orderDate || "-"}</td>
        <td class="fw-semibold">${order.employeeName || "-"}</td>
        <td>${order.doctorName || "-"}</td>
        <td>${order.distributorName || "-"}</td>
        <td>${order.headquarters || "-"}</td>
        <td>${order.productName || "-"}</td>
        <td>${order.orderQuantity || 0}</td>
        <td class="amount-success">${formatRupees(order.orderAmount)}</td>
        <td>${formatRupees(order.paidAmount)}</td>
        <td class="amount-danger">${formatRupees(order.dueAmount)}</td>
        <td>${order.paymentMode || "-"}</td>
       
        <td>${order.remarks || "-"}</td>
        <td>
          <button class="btn btn-danger btn-sm"
                  onclick="downloadBill(${order.id})">
            <i class="fa-solid fa-file-pdf"></i>
          </button>
        </td>
      </tr>
    `;
  });
}


function downloadBill(orderId) {
  window.open(`${BASE_URL}/order/bill/${orderId}`, "_blank");
}

function formatRupees(amount) {
  return "₹" + Number(amount || 0).toLocaleString("en-IN");
}
</script>

</body>
</html>
