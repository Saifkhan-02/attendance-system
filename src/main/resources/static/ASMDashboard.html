<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASM Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/asm-common.css">

<style>
.welcome-box h2{
  color:#0d6efd;
  font-weight:900;
  margin-bottom:6px;
}

.welcome-box h3{
  font-weight:900;
  color:#111827;
}

.welcome-box p{
  color:#475569;
  font-size:16px;
}
</style>
</head>

<body>

<div class="asm-container">

  <div class="welcome-box mb-3">
    <h2>Welcome Back,</h2>
    <h3 id="asmName">ASM</h3>
    <p>Track your team performance and field activity</p>
  </div>

  <div class="row g-3">

    <div class="col-6">
      <div class="asm-feature-card" onclick="window.location.href='ASMTeam.html'">
        <div class="asm-icon-box">
          <i class="fa-solid fa-users"></i>
        </div>
        <h5>My Team</h5>
        <div class="count" id="teamCount">0</div>
      </div>
    </div>

    <div class="col-6">
      <div class="asm-feature-card">
        <div class="asm-icon-box" style="color:#16a34a">
          <i class="fa-solid fa-calendar-check"></i>
        </div>
        <h5>Attendance</h5>
        <div class="count" id="attendanceCount">0</div>
      </div>
    </div>

    <div class="col-6">
      <div class="asm-feature-card">
        <div class="asm-icon-box" style="color:#7c3aed">
          <i class="fa-solid fa-user-doctor"></i>
        </div>
        <h5>Doctor Visits</h5>
        <div class="count" id="visitCount">0</div>
      </div>
    </div>

    <div class="col-6">
      <div class="asm-feature-card">
        <div class="asm-icon-box" style="color:#f97316">
          <i class="fa-solid fa-cart-shopping"></i>
        </div>
        <h5>Orders</h5>
        <div class="count" id="orderCount">0</div>
      </div>
    </div>

    <div class="col-6">
      <div class="asm-feature-card">
        <div class="asm-icon-box" style="color:#0d6efd">
          <i class="fa-solid fa-indian-rupee-sign"></i>
        </div>
        <h5>Sales</h5>
        <div class="count" id="saleAmount">₹0</div>
      </div>
    </div>

    <div class="col-6">
      <div class="asm-feature-card">
        <div class="asm-icon-box" style="color:#ef4444">
          <i class="fa-solid fa-receipt"></i>
        </div>
        <h5>Expenses</h5>
        <div class="count" id="expenseAmount">₹0</div>
      </div>
    </div>

  </div>

  <div class="asm-card mt-4">
    <h4 class="fw-bold mb-3">Top Performer</h4>

    <div class="d-flex align-items-center gap-3">
      <div class="asm-icon-box mb-0">
        <i class="fa-solid fa-trophy"></i>
      </div>

      <div>
        <h5 class="fw-bold mb-1" id="topName">-</h5>
        <div class="text-muted small" id="topHq">-</div>
        <div class="mt-1">
          Sales: <b id="topSales">₹0</b> |
          Visits: <b id="topVisits">0</b> |
          Orders: <b id="topOrders">0</b>
        </div>
      </div>
    </div>
  </div>

  <div class="asm-card mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0">My Team Summary</h4>
      <a href="ASMReports.html" class="btn btn-sm btn-outline-primary">Reports</a>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>MR</th>
            <th>HQ</th>
            <th>Visits</th>
            <th>Orders</th>
            <th>Sales</th>
            <th>Attendance</th>
          </tr>
        </thead>
        <tbody id="teamSummaryTable">
          <tr>
            <td colspan="6" class="text-center text-muted">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/asm-common.js"></script>

<script>
if (checkAsmSession()) {
  renderAsmSidebar("dashboard");
  renderAsmHeader("Welcome to Inflix Pharma");
}

const asmId = getAsmId();

setText("asmName", getAsmName());

window.onload = function(){
  loadFastDashboard();
  //setText("teamCount", "TEST");
  //loadDashboardSummary();
 // loadTopPerformer();
 // loadTeamSummary();
};
function loadFastDashboard(){
  fetch(`${BASE_URL}/asm/dashboard-fast/${asmId}`)
    .then(res => res.json())
    .then(data => {
      setText("teamCount", data.team || 0);
      setText("attendanceCount", data.present || 0);
      setText("visitCount", data.visits || 0);
      setText("orderCount", data.orders || 0);
      setText("saleAmount", money(data.sales));
      setText("expenseAmount", money(data.expense));

      const top = data.leaderboard && data.leaderboard.length > 0
        ? data.leaderboard[0]
        : null;
      if (top) {
        setText("topName", top.employeeName || "-");
        setText("topHq", top.headquarters || "-");
        setText("topSales", money(top.sales));
        setText("topVisits", top.visits || 0);
        setText("topOrders", top.orders || 0);
      }

      renderTeamSummary(data.leaderboard || []);
    })
    .catch(err => console.error("Fast Dashboard Error:", err));
}


function loadTopPerformer(){
  fetch(`${BASE_URL}/asm/top-performer/${asmId}`)
    .then(res => res.json())
    .then(data => {
      setText("topName", data.name || "-");
      setText("topHq", data.headquarters || "-");
      setText("topSales", money(data.sales));
      setText("topVisits", data.visits || 0);
      setText("topOrders", data.orders || 0);
    })
    .catch(err => console.error("Top Performer Error:", err));
}
function renderTeamSummary(data){
  const table = document.getElementById("teamSummaryTable");
  table.innerHTML = "";

  if(!data || data.length === 0){
    table.innerHTML = `
      <tr>
        <td colspan="7" class="text-center text-muted">No team data found</td>
      </tr>
    `;
    return;
  }

  data.forEach(row => {
    table.innerHTML += `
      <tr onclick="openEmployee(${row.employeeId})" style="cursor:pointer">
        <td>${row.date || "-"}</td>
        <td><strong>${row.employeeName || "-"}</strong></td>
        <td>${row.headquarters || "-"}</td>
        <td>${row.visits || 0}</td>
        <td>${row.orders || 0}</td>
        <td>${money(row.sales)}</td>
        <td>${row.attendance || "-"}</td>
      </tr>
    `;
  });
}

function openEmployee(id){
  localStorage.setItem("selectedEmployeeId", id);
  window.location.href = "ASMEmployeeDetails.html";
}
</script>

</body>
</html>
