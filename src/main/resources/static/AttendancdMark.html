<!DOCTYPE html>
<html>
<head>
    <title>GPS Attendance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            text-align:center;
            padding:40px;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            max-width:400px;
            margin:auto;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        button{
            padding:15px 25px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>GPS Attendance System</h2>

    <button onclick="markAttendance()">
        Mark Attendance
    </button>

    <div id="result"></div>

</div>

<script>

function markAttendance(){

    let employeeName = prompt("Enter Employee Name");

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

            function(position){

                let lat = position.coords.latitude;
                let lng = position.coords.longitude;

                
fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
.then(response => response.json())
.then(locationData => {

    let city =
        locationData.address.city ||
        locationData.address.town ||
        locationData.address.village ||
        "Unknown";

    let state = locationData.address.state || "";

    let fullAddress = locationData.display_name;

    fetch("/mark-attendance", {

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            employeeName:employeeName,
            latitude:lat,
            longitude:lng,
            city:city,
            state:state,
            address:fullAddress

        })

    })

    .then(response => response.text())

    .then(data => {

        document.getElementById("result").innerHTML =
        data +
        "<br><br>Latitude: " + lat +
        "<br>Longitude: " + lng +
        "<br>City: " + city +
        "<br>State: " + state +
        "<br>Address: " + fullAddress;

    });

});

            },

            function(){
                alert("Location access denied");
            }

        );

    }else{
        alert("Geolocation not supported");
    }
}
</script>

</body>
</html>
