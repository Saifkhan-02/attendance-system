<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Visit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    background:#f4f6fb;
}

.top-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.visit-card,
.history-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
}

.btn-submit{
    background:#0d6efd;
    border:none;
    border-radius:12px;
    padding:12px 30px;
}

.btn-submit:hover{
    background:#0b5ed7;
}

.status-completed{
    color:#198754;
    font-weight:600;
}

.status-pending{
    color:#fd7e14;
    font-weight:600;
}

.status-rejected{
    color:#dc3545;
    font-weight:600;
}
</style>
</head>

<body>

<div class="top-header text-center">
    <h2 class="fw-bold mb-1">Doctor Visit</h2>
    <p class="mb-0">Submit and track your doctor visit reports</p>
</div>

<div class="container py-4">

    <!-- Doctor Visit Form -->
    <div class="card visit-card">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-4">Submit Doctor Visit</h4>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Doctor Name</label>
                    <input type="text" id="doctorName" class="form-control" placeholder="Enter doctor name">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Specialization</label>
                    <input type="text" id="specialization" class="form-control" placeholder="Enter specialization">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hospital / Clinic</label>
                    <input type="text" id="hospitalName" class="form-control" placeholder="Enter hospital or clinic">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Visit Date</label>
                    <input type="date" id="visitDate" class="form-control">
                </div>

                <!-- <div class="col-md-6">
                    <label class="form-label">Visit Time</label>
                    <input type="time" id="visitTime" class="form-control">
                </div> -->

                <div class="col-md-6">
                    <label class="form-label">Purpose</label>
                    <select id="purpose" class="form-select">
                        <option>Product Promotion</option>
                        <option>Sample Distribution</option>
                        <option>Order Discussion</option>
                        <option>Follow Up</option>
                        <option>New Product Launch</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input type="text" id="location" class="form-control" placeholder="Enter location / Address">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Doctor Response</label>
                    <select id="doctorResponse" class="form-select">
                        <option>Positive</option>
                        <option>Neutral</option>
                        <option>Negative</option>
                        <option>Follow-up Required</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label">Remarks</label>
                    <textarea id="remarks" rows="4" class="form-control" placeholder="Enter visit remarks"></textarea>
                </div>

                <div class="col-md-12">
                    <button class="btn btn-submit text-white" onclick="submitDoctorVisit()">
                        <i class="fa-solid fa-paper-plane me-2"></i>
                        Submit Visit
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- Doctor Visit History -->
    <div class="card history-card mt-4">
        <div class="card-body">

            <h4 class="fw-bold mb-4">Doctor Visit History</h4>

            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-primary">
                        <tr>
                            <th>Doctor</th>
                            <th>Specialization</th>
                            <th>Hospital</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Purpose</th>
                            <th>Response</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="doctorVisitTable"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>

window.onload = loadDoctorVisitHistory;

function submitDoctorVisit() {

    const visitData = {

        employeeId:
            localStorage.getItem("employeeId"),

        employeeName:
            localStorage.getItem("employeeName"),

        doctorName:
            document.getElementById("doctorName").value,

        specialization:
            document.getElementById("specialization").value,

        hospitalName:
            document.getElementById("hospitalName").value,

        visitDate:
            document.getElementById("visitDate").value,

        purpose:
            document.getElementById("purpose").value,

        location:
            document.getElementById("location").value,

        doctorResponse:
            document.getElementById("doctorResponse").value,

        remarks:
            document.getElementById("remarks").value
    };

    fetch(`${BASE_URL}/doctor-visit/save`, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(visitData)
    })

    .then(response => response.json())

    .then(data => {

        alert("Doctor Visit Submitted Successfully");

        document.getElementById("doctorName").value = "";
        document.getElementById("specialization").value = "";
        document.getElementById("hospitalName").value = "";
        document.getElementById("visitDate").value = "";
        document.getElementById("location").value = "";
        document.getElementById("remarks").value = "";

        loadDoctorVisitHistory();
    })

    .catch(error => {

        console.error(error);

        alert("Failed To Submit Visit");

    });

}

function loadDoctorVisitHistory() {

    const employeeId =
        localStorage.getItem("employeeId");

    fetch(`${BASE_URL}/doctor-visit/history/${employeeId}`)

    .then(response => response.json())

    .then(data => {

        const table =
            document.getElementById("doctorVisitTable");

        table.innerHTML = "";

        if(data.length === 0){

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center">
                        No Doctor Visits Found
                    </td>
                </tr>
            `;

            return;
        }

        data.forEach(visit => {

            let statusClass =
                "status-completed";

            if(visit.status === "Rejected"){

                statusClass =
                    "status-rejected";
            }

            if(visit.status === "Pending"){

                statusClass =
                    "status-pending";
            }

            table.innerHTML += `

            <tr>

                <td>${visit.doctorName || "-"}</td>

                <td>${visit.specialization || "-"}</td>

                <td>${visit.hospitalName || "-"}</td>

                <td>${visit.visitDate || "-"}</td>

                <td>${visit.visitTime || "-"}</td>

                <td>${visit.purpose || "-"}</td>

                <td>${visit.doctorResponse || "-"}</td>

                <td>
                    <span class="${statusClass}">
                        ${visit.status || "Completed"}
                    </span>
                </td>

            </tr>

            `;
        });

    })

    .catch(error => {

        console.error(error);

    });

}

</script>

</body>
</html>
