    <!-- Doctor Visit History -->
    <div class="card history-card mt-4">
        <div class="card-body">

            <h4 class="fw-bold mb-4">Doctor Visit History</h4>

            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-primary">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>

let cameraStream = null;
//let capturedPhotoBase64 = "";

window.onload = function () {
    loadDoctorVisitHistory();
    getCurrentLocation();
};

function submitDoctorVisit() {

    if (!document.getElementById("workingWith").value) {
    alert("Please select Working With");
    return;
}

    const workingWith = document.getElementById("workingWith").value;
    if (
        workingWith != "Individual" &&
        !document.getElementById("workingPersonName").value.trim()
    ) {
        alert("Please enter person Name");
        return;
    }

    if (!document.getElementById("doctorName").value.trim()) {
    alert("Doctor name required ");
    return;
}

if (!document.getElementById("specialization").value.trim()) {
    alert("Please fill Specialization First");
    return;
}

if (!document.getElementById("dob").value) {
    alert("Please select DOB");
    return;
}

if (!document.getElementById("anniversaryDate").value) {
    alert("Please select DOA");
    return;
}

if (!document.getElementById("hospitalName").value.trim()) {
    alert("Please fill Hospital / Clinic First ");
    return;
}

if (!document.getElementById("visitDate").value) {
    alert("Please select Visit date ");
    return;
}

if (!document.getElementById("locationName").value.trim()) {
    alert("your Current location is not accurate ");
    return;
}
if (!document.getElementById("landmark").value.trim()) {
    alert("Please enter Landmark / Clinic Area");
    return;
}

if (Number(document.getElementById("accuracy").value) > 100) {
    alert("Location accuracy is low. Please go to an open area then refresh/retry.");
    return;
}

if (!document.getElementById("doctorResponse").value.trim()) {
    alert("Please select Doctor response First");
    return;
}

//if (!capturedPhotoBase64) {
  //  alert("Please upload image first");
    //return;
//}

    const visitData = {

        employeeId:
            localStorage.getItem("employeeId"),

        employeeName:
            localStorage.getItem("employeeName"),

        workingWith:
            document.getElementById("workingWith").value,

        workingPersonName:
            document.getElementById("workingPersonName").value,

        doctorName:
            document.getElementById("doctorName").value,

        specialization:
            document.getElementById("specialization").value,

        dob:
            document.getElementById("dob").value,
        
        anniversaryDate:
            document.getElementById("anniversaryDate").value,

        hospitalName:
            document.getElementById("hospitalName").value,

        visitDate:
            document.getElementById("visitDate").value,

        location:
            document.getElementById("locationName").value,

        landmark:
            document.getElementById("landmark").value,

        latitude:
            document.getElementById("latitude").value,

        longitude:
            document.getElementById("longitude").value,

        accuracy:
            document.getElementById("accuracy").value,

        doctorResponse:
            document.getElementById("doctorResponse").value,

        remarks:
            document.getElementById("remarks").value,

       // photo:
         //   capturedPhotoBase64
    };

   fetch(`${BASE_URL}/doctor-visit/save`, {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(visitData)
})
.then(async response => {
    const text = await response.text();

    console.log("STATUS:", response.status);
    console.log("RESPONSE:", text);
    console.log("SENT DATA:", visitData);

    if (!response.ok) {
        throw new Error(text);
    }

    alert("Doctor Visit Submitted Successfully");
    loadDoctorVisitHistory();
})
.catch(error => {
    console.error("SAVE ERROR:", error);
    alert("Failed To Submit Visit");
});

}

function loadDoctorVisitHistory() {

    const employeeId =
        localStorage.getItem("employeeId");

    fetch(`${BASE_URL}/doctor-visit/history/${employeeId}`)

    .then(response => response.json())

    .then(data => {

        const table =
            document.getElementById("doctorVisitTable");

        table.innerHTML = "";

        if(data.length === 0){

            table.innerHTML = `
                <tr>
                    <td colspan="16" class="text-center">
                        No Doctor Visits Found
                    </td>
                </tr>
            `;

            return;
        }

        data.forEach(visit => {

            let statusClass =
                "status-completed";

            if(visit.status === "Rejected"){

                statusClass =
                    "status-rejected";
            }

            if(visit.status === "Pending"){

                statusClass =
                    "status-pending";
            }

            table.innerHTML += `

            <tr>
                <td>${visit.workingWith || "-"}</td>

                <td>${visit.workingPersonName || "-"}</td>

                <td>${visit.doctorName || "-"}</td>

                <td>${visit.specialization || "-"}</td>


                <td>${visit.dob || "-"}</td>
                
                <td>${visit.anniversaryDate || "-"}</td>

                <td>${visit.hospitalName || "-"}</td>

                <td>${visit.visitDate || "-"}</td>

                <td>${visit.visitTime || "-"}</td>

                <td>${visit.location || "-"}</td>

                <td>${visit.landmark || "-"}</td>
                <td>${visit.accuracy ? visit.accuracy + " m" : "-"}</td>

                <td>${visit.photo ? `<img src="${visit.photo}" width="60" style="border-radius:8px;">` : "-"} </td>

                <td>${visit.doctorResponse || "-"}</td>

                <td>${visit.remarks || "-"}</td>

                <td>
                    <span class="${statusClass}">
                        ${visit.status || "Completed"}
                    </span>
                </td>

            </tr>

            `;
        });

    })

    .catch(error => {

        console.error(error);

    });

}
// Camera function
function openCamera() {
    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: "environment"
        },
        audio: false
    })
    .then(function (stream) {
        cameraStream = stream;

        const video = document.getElementById("cameraPreview");
        video.srcObject = stream;
        video.classList.remove("d-none");

        document.getElementById("captureBtn").classList.remove("d-none");
    })
    .catch(function (error) {
        console.error(error);
        alert("Camera open nahi ho pa raha. Permission allow karo.");
    });
}



function getCurrentLocation() {
    const locationInput = document.getElementById("locationName");

    if (!navigator.geolocation) {
        locationInput.value = "Location not supported";
        return;
    }

    locationInput.value = "Fetching location...";

    navigator.geolocation.getCurrentPosition(
        function (position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const acc = position.coords.accuracy;

            document.getElementById("latitude").value = lat;
            document.getElementById("longitude").value = lng;
            document.getElementById("accuracy").value = acc;

          //  if (acc > 100) {
            //    alert("Location accuracy is low, Go to an open area and then referesh.");
           // }

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&zoom=18&lat=${lat}&lon=${lng}`)
                .then(response => response.json())
                .then(data => {
                    locationInput.value = data.display_name || "Location found";
                })
                .catch(error => {
                    console.error(error);
                    locationInput.value = "Location found";
                });
        },
        function (error) {
            console.error(error);
            locationInput.value = "";
            alert("Location permission allow karo");
        },
        {
            enableHighAccuracy: true,
            timeout: 30000,
            maximumAge: 0
        }
    );
}

</script>
