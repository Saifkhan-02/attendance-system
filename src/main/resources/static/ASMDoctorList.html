<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASM Doctor & Chemist List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/asm-common.css">

    <style>
      body { background: #f4f6fb; }
      .top-header {
        background: linear-gradient(135deg, #0d4f9c, #3f7fe0);
        color: white;
        padding: 25px;
        border-radius: 0 0 25px 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }
      .back-btn {
        width: 42px;
        height: 42px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        transition: 0.3s;
      }
      .back-btn:hover { background: rgba(255, 255, 255, 0.3); }
      .doctor-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        transition: 0.3s;
        cursor: pointer;
      }
      .doctor-card:hover { transform: translateY(-5px); }
      .icon-box {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: #e9f2ff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0d6efd;
        font-size: 24px;
      }
      .detail-label { font-size: 13px; color: #6c757d; }
      .detail-value { font-weight: 600; }
      .btn-call {
        background: #198754;
        color: white;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
        display: block;
        text-align: center;
        text-decoration: none;
        margin-top: 15px;
      }
      .btn-call:hover { background: #157347; color: white; }
    </style>
  </head>

  <body>
    <div class="top-header">
      <div class="d-flex align-items-center justify-content-between">
        <button class="back-btn" onclick="window.location.href = 'ASMDashboard.html'">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="text-center flex-grow-1">
          <h3 class="fw-bold mb-1" id="pageTitle">Team's Doctor List</h3>
          <p class="mb-0 text-white-50" id="pageSubtitle" style="font-size: 14px;">
            List of all doctors visited by your MRs
          </p>
        </div>
        <div style="width: 42px"></div>
      </div>
    </div>

    <div class="container py-4">
      <!-- Category Selection -->
      <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body">
          <label class="form-label fw-bold mb-3">Select Category</label>
          <div class="d-flex gap-2 flex-wrap">
            <input type="radio" class="btn-check" name="listCategory" id="listDoctor" value="DOCTOR" checked onchange="changeListCategory()" />
            <label class="btn btn-outline-primary" for="listDoctor">
              <i class="fa-solid fa-user-doctor me-2"></i> Doctors
            </label>

            <input type="radio" class="btn-check" name="listCategory" id="listChemist" value="CHEMIST" onchange="changeListCategory()" />
            <label class="btn btn-outline-success" for="listChemist">
              <i class="fa-solid fa-prescription-bottle-medical me-2"></i> Chemists
            </label>
          </div>
        </div>
      </div>

      <!-- Filters -->
      <div class="row g-2 mb-4">
        <div class="col-12 col-md-4">
          <input type="text" id="searchDoctor" class="form-control" placeholder="Search by name, area or hospital..." onkeyup="applyFilters()" />
        </div>
        <div class="col-6 col-md-4">
          <select id="mrFilter" class="form-select" onchange="applyFilters()">
            <option value="">All MRs (Employees)</option>
          </select>
        </div>
        <div class="col-6 col-md-4">
          <select id="routeFilter" class="form-select" onchange="applyFilters()">
            <option value="">All Routes</option>
          </select>
        </div>
      </div>

      <!-- Doctor List Section -->
      <div id="doctorSection">
        <div class="row g-4" id="doctorList">
          <!-- Dynamic cards will load here -->
        </div>
      </div>
    </div>

    <!-- Doctor Detail Modal -->
    <div class="modal fade" id="doctorModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalDoctorName">Doctor Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            
            <div class="row mb-3">
              <div class="col-6">
                <div class="detail-label">Handled By (MR)</div>
                <div class="detail-value text-primary" id="modalMrName">-</div>
              </div>
              <div class="col-6">
                <div class="detail-label">Route</div>
                <div class="detail-value text-warning" id="modalRoute">-</div>
              </div>
            </div>

            <div class="mb-3">
              <div class="detail-label" id="modalSpecializationLabel">Specialization</div>
              <div class="detail-value" id="modalSpecialization">-</div>
            </div>

            <div class="mb-3">
              <div class="detail-label" id="modalHospitalLabel">Hospital / Clinic</div>
              <div class="detail-value" id="modalHospital">-</div>
            </div>

            <div class="mb-3">
              <div class="detail-label">Landmark/Area</div>
              <div class="detail-value" id="modalArea">-</div>
            </div>

            <div class="mb-3">
              <div class="detail-label">Location Address</div>
              <div class="detail-value" id="modalLocation">-</div>
            </div>

            <div class="row mb-3">
              <div class="col-6">
                <div class="detail-label">DOB</div>
                <div class="detail-value" id="modalDob">-</div>
              </div>
              <div class="col-6">
                <div class="detail-label">Anniversary Date</div>
                <div class="detail-value" id="modalAnniversary">-</div>
              </div>
            </div>

            <div class="mb-3">
              <div class="detail-label">Last Visit Date</div>
              <div class="detail-value text-success" id="modalVisitDate">-</div>
            </div>

            <a id="callNowBtn" href="#" class="btn-call"><i class="fa-solid fa-phone me-2"></i> Call Now</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/asm-common.js"></script>
    <script src="js/asm-doctor-list.js"></script>
  </body>
</html>
