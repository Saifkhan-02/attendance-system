<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leave Request</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#f4f6fb;
}

.top-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}
.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.back-btn:hover{
  background:rgba(255,255,255,.3);
}
.leave-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
}

.btn-submit{
    background:#0d6efd;
    border:none;
    border-radius:12px;
    padding:12px 30px;
}

.btn-submit:hover{
    background:#0b5ed7;
}

.history-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.status-approved{
    color:#198754;
    font-weight:600;
}

.status-pending{
    color:#fd7e14;
    font-weight:600;
}

.status-rejected{
    color:#dc3545;
    font-weight:600;
}

</style>

</head>
<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">

    <button class="back-btn"
            onclick="window.location.href='Dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Leave Request</h2>
      <p class="mb-0">Apply for leave</p>
    </div>

    <div style="width:42px"></div>

  </div>
</div>

<div class="container py-4">

    <!-- Leave Form -->
    <div class="card leave-card">

        <div class="card-body p-4">

            <h4 class="fw-bold mb-4">
                Apply For Leave
            </h4>

            <div class="row g-3">
                <!-- Leave Type -->
                <div class="col-md-6">

                    <label class="form-label">
                        Leave Type
                    </label>

                  <select class="form-select" id="leaveType">

    <option value="">-- Select Leave Type --</option>

    <option value="Sick Leave">Sick Leave</option>

    <option value="Casual Leave">Casual Leave</option>

    <option value="Emergency Leave">Emergency Leave</option>

    <option value="Annual Leave">Annual Leave</option>

</select>
                </div>
                <!-- From Date -->
                <div class="col-6 col-md-6">

                    <label class="form-label">
                        From Date
                    </label>

                    <input type="date" id="fromDate"
                           class="form-control">

                </div>
                <!-- To Date -->
                <div class="col-6 col-md-6">

                    <label class="form-label">
                        To Date
                    </label>
                    <input type="date" id="toDate"
                           class="form-control">

                </div>
                <!-- Emergency Contact -->
                <div class="col-md-12">

                    <label class="form-label">
                        Emergency Contact
                    </label>

                    <input type="text" id="emergencyContact"
                           class="form-control"
                           placeholder="Enter Contact Number">

                </div>

                <!-- Reason -->
                <div class="col-md-12">

                    <label class="form-label">
                        Reason
                    </label>

                    <textarea
                        rows="4"
                        class="form-control"
                        id="reason"
                        placeholder="Write your reason here..."></textarea>

                </div>

                <!-- Submit Button -->
                <div class="col-md-12">

                    <button class="btn btn-submit text-white" onclick="applyLeave()">

                        <i class="fa-solid fa-paper-plane me-2"></i>

                        Submit Request

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Leave History -->
    <div class="card history-card mt-4">

        <div class="card-body">

            <h4 class="fw-bold mb-4">
                Leave History
            </h4>

            <div class="table-responsive">

                <table class="table align-middle">
                    <thead>
                        <tr>                           
                            <th>Type</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Reason</th>
                            <th>Emergency Cont.</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="leaveHistoryTable">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<!-- <script src="js/session-check.js"></script> -->

<script>

    //localStorage.setItem("employeeMobile", data.mobile);
window.onload = function () {
  const today = new Date().toISOString().split("T")[0];

  document.getElementById("fromDate").min = today;
  document.getElementById("toDate").min = today;

  loadLeaveHistory();
};

document.getElementById("fromDate").addEventListener("change", function () {
  document.getElementById("toDate").min = this.value;
});

   function applyLeave() {

  const employeeId = localStorage.getItem("employeeId");
  const employeeName = localStorage.getItem("employeeName");

  const leaveType = document.getElementById("leaveType").value;
  const fromDate = document.getElementById("fromDate").value;
  const toDate = document.getElementById("toDate").value;
  const emergencyContact = document.getElementById("emergencyContact").value.trim();
  const reason = document.getElementById("reason").value.trim();

  if (!employeeId || !employeeName) {
    alert("Session expired. Please login again.");
    window.location.href = "index.html";
    return;
  }

  if (!leaveType) {
    alert("Please select leave type.");
    return;
  }

  if (!fromDate) {
    alert("Please select from date.");
    return;
  }

  if (!toDate) {
    alert("Please select to date.");
    return;
  }

  if (toDate < fromDate) {
    alert("To Date cannot be before From Date.");
    return;
  }

  if (!emergencyContact) {
    alert("Please enter emergency contact number.");
    return;
  }

  if (!/^[6-9]\d{9}$/.test(emergencyContact)) {
    alert("Please enter valid 10 digit mobile number.");
    return;
  }

  if (!reason) {
    alert("Please enter leave reason.");
    return;
  }

  if (reason.length < 10) {
    alert("Reason must be at least 10 characters.");
    return;
  }

  fetch(`${BASE_URL}/leave/apply`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      employeeId,
      employeeName,
      leaveType,
      fromDate,
      toDate,
      emergencyContact,
      reason
    })
  })
  .then(async response => {
    if (!response.ok) {
      throw new Error(await response.text());
    }
    return response.json();
  })
  .then(data => {
    alert("Leave Request Submitted");

    document.getElementById("leaveType").selectedIndex = 0;
    document.getElementById("fromDate").value = "";
    document.getElementById("toDate").value = "";
    document.getElementById("emergencyContact").value = "";
    document.getElementById("reason").value = "";

    loadLeaveHistory();
  })
  .catch(error => {
    console.error(error);
    alert(error.message || "Failed to submit leave request.");
  });
}

function loadLeaveHistory() {
  const employeeId = localStorage.getItem("employeeId");
  const table = document.getElementById("leaveHistoryTable");

  console.log("Leave employeeId =", employeeId);

  if (!employeeId) {
    table.innerHTML = `<tr><td colspan="5" class="text-center">Please login again</td></tr>`;
    return;
  }

  fetch(`${BASE_URL}/leave/history/${employeeId}`)
    .then(response => response.json())
    .then(data => {
      console.log("Leave history data =", data);

      if (!data || data.length === 0) {
        table.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No leave history found</td></tr>`;
        return;
      }

      let rows = "";

      data.forEach(leave => {
        rows += `
          <tr>
            <td>${leave.leaveType || "-"}</td>
            <td>${leave.fromDate || "-"}</td>
            <td>${leave.toDate || "-"}</td>
            <td>${leave.reason || "-"}</td>
            <td>${leave.emergencyContact || "-"}</td>
            <td>
              <span class="${
                leave.status === "Approved" ? "status-approved" :
                leave.status === "Pending" ? "status-pending" : "status-rejected"
              }">
                ${leave.status || "Pending"}
              </span>
            </td>
          </tr>
        `;
      });

      table.innerHTML = rows;
    });
}
</script>
</body>
</html>
