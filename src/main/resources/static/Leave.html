<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leave Request</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#f4f6fb;
}

.top-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.leave-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
}

.btn-submit{
    background:#0d6efd;
    border:none;
    border-radius:12px;
    padding:12px 30px;
}

.btn-submit:hover{
    background:#0b5ed7;
}

.history-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.status-approved{
    color:#198754;
    font-weight:600;
}

.status-pending{
    color:#fd7e14;
    font-weight:600;
}

.status-rejected{
    color:#dc3545;
    font-weight:600;
}

</style>

</head>
<body>

<div class="top-header text-center">

    <h2 class="fw-bold mb-1">
        Leave Request
    </h2>

    <p class="mb-0">
        Apply and track your leaves
    </p>

</div>

<div class="container py-4">

    <!-- Leave Form -->

    <div class="card leave-card">

        <div class="card-body p-4">

            <h4 class="fw-bold mb-4">
                Apply For Leave
            </h4>

            <div class="row g-3">

                <!-- Leave Type -->
                <div class="col-md-6">

                    <label class="form-label">
                        Leave Type
                    </label>

                    <select class="form-select " id="leaveType">

                        <option>Sick Leave</option>
                        <option>Casual Leave</option>
                        <option>Emergency Leave</option>
                        <option>Annual Leave</option>

                    </select>

                </div>

                <!-- Half Day -->
                <div class="col-md-6">

                    <label class="form-label">
                        Half Day
                    </label>

                    <select class="form-select" id="halfDay">

                        <option>No</option>
                        <option>Yes</option>

                    </select>

                </div>

                <!-- From Date -->
                <div class="col-md-6">

                    <label class="form-label">
                        From Date
                    </label>

                    <input type="date" id="fromDate"
                           class="form-control">

                </div>

                <!-- To Date -->
                <div class="col-md-6">

                    <label class="form-label">
                        To Date
                    </label>

                    <input type="date" id="toDate"
                           class="form-control">

                </div>

                <!-- Emergency Contact -->
                <div class="col-md-12">

                    <label class="form-label">
                        Emergency Contact
                    </label>

                    <input type="text" id="emergencyContact"
                           class="form-control"
                           placeholder="Enter Contact Number">

                </div>

                <!-- Reason -->
                <div class="col-md-12">

                    <label class="form-label">
                        Reason
                    </label>

                    <textarea
                        rows="4"
                        class="form-control"
                        id="reason"
                        placeholder="Write your reason here..."></textarea>

                </div>

                <!-- Submit Button -->
                <div class="col-md-12">

                    <button class="btn btn-submit text-white" onclick="applyLeave()">

                        <i class="fa-solid fa-paper-plane me-2"></i>

                        Submit Request

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Leave History -->

    <div class="card history-card mt-4">

        <div class="card-body">

            <h4 class="fw-bold mb-4">
                Leave History
            </h4>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                        <tr>
                            
                            <th>Type</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="leaveHistoryTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>

    //localStorage.setItem("employeeMobile", data.mobile);

    function applyLeave() {

    const employeeId =
        localStorage.getItem("employeeId");

    fetch(`${BASE_URL}/leave/apply`, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            employeeId: employeeId,

            employeeName: 
                localStorage.getItem("employeeName"),
        
            leaveType:
                document.getElementById("leaveType").value,

            fromDate:
                document.getElementById("fromDate").value,

            toDate:
                document.getElementById("toDate").value,

            emergencyContact:
                document.getElementById("emergencyContact").value,

            reason:
                document.getElementById("reason").value
        })
    })

    .then(response => response.json())

    .then(data => {

        alert("Leave Request Submitted");

        document.getElementById("leaveType").selectedIndex = 0;
        document.getElementById("halfDay").selectedIndex = 0;
        document.getElementById("fromDate").value ="";
        document.getElementById("toDate").value ="";
        document.getElementById("emergencyContact").value ="";
        document.getElementById("reason").value ="";
        

        loadLeaveHistory();
    });
}

window.onload = loadLeaveHistory;

function loadLeaveHistory() {

    const employeeId =
        localStorage.getItem("employeeId");
    const table =
    document.getElementById("leaveHistoryTable");

    fetch(`${BASE_URL}/leave/history/${employeeId}`)

    .then(response => response.json())

    .then(data => {

        let rows = "";

        data.forEach(leave => {

            rows += `
            <tr>
                <td>${leave.leaveType}</td>
                <td>${leave.fromDate}</td>
                <td>${leave.toDate}</td>
                <td>${leave.reason}</td>
                <td>${leave.status}</td>

                <td>
                    <span class="${
                        leave.status === "Approved" ? "status-approved" :
                        leave.status === "Pending" ? "status-pending" : "status-rejected"
                    }">
                        ${leave.status}
                    </span>
                </td>
            </tr>
            `;
        });

        document.getElementById("leaveHistoryTable")
                .innerHTML = rows;
    });
}

</script>
</body>
</html>
