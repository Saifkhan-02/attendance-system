<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASM Expenses</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/asm-common.css">

<style>
body {
  background: #f4f6fb;
}

.top-header {
  background: linear-gradient(135deg, #0d4f9c, #3f7fe0);
  color: white;
  padding: 25px;
  border-radius: 0 0 25px 25px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}

.back-btn {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s;
}

.back-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}

.summary-card, .history-card {
  border: none;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  height: 100%;
}

.icon-box {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin: auto;
}

.bg-fare { background: #dcfce7; color: #16a34a; }
.bg-da { background: #ffedd5; color: #ea580c; }
.bg-other { background: #fee2e2; color: #dc2626; }
.bg-total { background: #dbeafe; color: #2563eb; }

.form-control {
  border-radius: 12px;
  padding: 11px;
}

.amount-text {
  font-weight: 700;
  color: #198754;
}

.table th, .table td {
  white-space: nowrap;
  vertical-align: middle;
}
</style>
</head>

<body>

<!-- ASM Header -->
<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">
    <button class="back-btn" onclick="window.location.href='ASMDashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">My Expenses</h2>
      <p class="mb-0 text-white-50">Route wise monthly expense summary</p>
    </div>

    <div style="width: 42px"></div>
  </div>
</div>

<div class="container py-4">

  <!-- Filter Section -->
  <div class="row mb-3">
    <div class="col-md-3 col-8">
      <input type="month" id="expenseMonth" class="form-control">
    </div>

    <div class="col-md-2 col-4">
      <button class="btn btn-primary w-100" style="padding: 11px; border-radius: 12px;" onclick="loadExpenses()">
        Filter
      </button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center d-flex flex-column justify-content-center">
          <div class="icon-box bg-total mb-2">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <h6 class="text-muted">Total Expense</h6>
          <h3 class="mb-0 fw-bold" id="totalExpense">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center d-flex flex-column justify-content-center">
          <div class="icon-box bg-fare mb-2">
            <i class="fa-solid fa-money-bill-wave"></i>
          </div>
          <h6 class="text-muted">Total Fare</h6>
          <h3 class="mb-0 fw-bold" id="totalFare">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center d-flex flex-column justify-content-center">
          <div class="icon-box bg-da mb-2">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <h6 class="text-muted">Total D.A</h6>
          <h3 class="mb-0 fw-bold" id="totalDa">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center d-flex flex-column justify-content-center">
          <div class="icon-box bg-other mb-2">
            <i class="fa-solid fa-receipt"></i>
          </div>
          <h6 class="text-muted">Other</h6>
          <h3 class="mb-0 fw-bold" id="totalOther">₹0</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Route Wise Table -->
  <div class="card history-card">
    <div class="card-body p-4">
      <h4 class="fw-bold mb-3">
        <i class="fa-solid fa-route me-2 text-primary"></i>
        Route Wise Expense
      </h4>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-primary">
            <tr>
              <th>Date</th>
              <th>Route</th>
              <th>Visits</th>
              <th>Total KM</th>
              <th>Fare</th>
              <th>D.A</th>
              <th>Other</th>
              <th>Total Expense</th>
            </tr>
          </thead>
          <tbody id="expenseTable">
            <tr>
              <td colspan="8" class="text-center text-muted">Loading expenses...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/asm-common.js"></script>

<script>
window.onload = function () {
  if (typeof checkAsmSession === "function") {
    checkAsmSession();
  }

  // Set current month as default
  document.getElementById("expenseMonth").value = new Date().toISOString().slice(0, 7);
  loadExpenses();
};

function loadExpenses() {
  // Use ASM ID safely
  const employeeId = localStorage.getItem("asmId") || localStorage.getItem("employeeId");
  const month = document.getElementById("expenseMonth").value;

  // Exact MR API that fetches from Tour Plan
  fetch(`${BASE_URL}/tour-plan/monthly/history/${employeeId}/${month}`)
    .then(response => response.json())
    .then(data => {
      renderExpenseSummary(data || []);
    })
    .catch(error => {
      console.error(error);
      const table = document.getElementById("expenseTable");
      table.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Failed to load expenses</td></tr>`;
    });
}

function renderExpenseSummary(data) {
  let totalFare = 0;
  let totalDa = 0;
  let totalOther = 0;

  const routeMap = {};

  data.forEach(item => {
    const route = item.routeName || "Unknown";

    const km = Number(item.travelKm || 0);
    const fare = Number(item.fareAmount || 0);
    const da = Number(item.daAmount || 0);
    const other = Number(item.otherAmount ?? item.other ?? 0);

    totalFare += fare;
    totalDa += da;
    totalOther += other;

    if (!routeMap[route]) {
      routeMap[route] = {
        visits: 0,
        km: 0,
        fare: 0,
        da: 0,
        other: 0,
        dates: []
      };
    }

    routeMap[route].visits++;
    routeMap[route].km += km;
    routeMap[route].fare += fare;
    routeMap[route].da += da;
    routeMap[route].other += other;

    // Formatting date neatly if possible
    routeMap[route].dates.push(item.travelDate || "-");
  });

  document.getElementById("totalFare").innerText = formatRupees(totalFare);
  document.getElementById("totalDa").innerText = formatRupees(totalDa);
  document.getElementById("totalOther").innerText = formatRupees(totalOther);
  document.getElementById("totalExpense").innerText = formatRupees(totalFare + totalDa + totalOther);

  const table = document.getElementById("expenseTable");
  table.innerHTML = "";

  const routes = Object.keys(routeMap);

  if (routes.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="8" class="text-center text-muted">No expenses found for this month</td>
      </tr>
    `;
    return;
  }

  routes.forEach(route => {
    const item = routeMap[route];
    const total = Number(item.totalExpense ?? (item.fare + item.da + item.other));

    table.innerHTML += `
      <tr>
        <td>${item.dates.join(", ")}</td>
        <td class="fw-semibold">${route}</td>
        <td>${item.visits}</td>
        <td>${item.km}</td>
        <td>${formatRupees(item.fare)}</td>
        <td>${formatRupees(item.da)}</td>
        <td>${formatRupees(item.other)}</td>
        <td class="amount-text">${formatRupees(total)}</td>
      </tr>
    `;
  });
}

function formatRupees(amount) {
  return "₹" + Number(amount || 0).toLocaleString("en-IN");
}
</script>

</body>
</html>
