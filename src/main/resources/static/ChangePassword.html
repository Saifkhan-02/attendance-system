<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
  background:#f4f6fb;
}

.top-header{
  background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
  color:white;
  padding:22px;
  border-radius:0 0 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.password-card{
  border:none;
  border-radius:24px;
  box-shadow:0 12px 35px rgba(0,0,0,.08);
  margin-top:5px;
}

.icon-box{
  width: 20px;
  height:20px;
  border-radius:22px;
  background:#e9f2ff;
  color:#0d6efd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  margin:auto;
}

.form-control{
  border-radius:14px;
  padding:13px 45px 13px 14px;
}

.input-wrap{
  position:relative;
}

.toggle-eye{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#6c757d;
}

.btn-change{
  background:#0d6efd;
  border:none;
  border-radius:14px;
  padding:13px;
  font-weight:700;
}

.btn-change:hover{
  background:#0b5ed7;
}

.rule-box{
  background:#f8fbff;
  border:1px solid #dbeafe;
  border-radius:16px;
  padding:14px;
  font-size:14px;
}

.rule-box i{
  color:#198754;
}

@media(max-width:768px){
  .password-card{
    margin-top:25px;
  }
}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">

    <button class="back-btn" onclick="window.location.href='Dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Change Password</h2>
      <p class="mb-0">Update your account password securely</p>
    </div>

    <div style="width:42px"></div>

  </div>
</div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">

      <div class="card password-card">
        <div class="card-body p-4">

          <div class="text-center mb-4">
            <div class="icon-box mb-2">
              <i class="fa-solid fa-lock"></i>
            </div>
            <!-- <h4 class="fw-bold mb-1">Secure Password Update</h4>
            <p class="text-muted mb-0">Use a strong password for better security</p> -->
          </div>

          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <div class="input-wrap">
              <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password">
              <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('currentPassword', this)"></i>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">New Password</label>
            <div class="input-wrap">
              <input type="password" id="newPassword" class="form-control" placeholder="Enter new password">
              <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('newPassword', this)"></i>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <div class="input-wrap">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password">
              <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('confirmPassword', this)"></i>
            </div>
          </div>

          <div class="rule-box mb-4">
            <div><i class="fa-solid fa-circle-check me-2"></i>Minimum 6 characters</div>
            <div><i class="fa-solid fa-circle-check me-2"></i>New password and confirm password must match</div>
            <div><i class="fa-solid fa-circle-check me-2"></i>Do not use your old password again</div>
            <div><i class="fa-solid fa-circle-check me-2"></i>Use a combination of letters, numbers, and special characters</div>
          </div>

          <button class="btn btn-change text-white w-100" onclick="changePassword()">
            <i class="fa-solid fa-key me-2"></i>
            Change Password
          </button>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>
function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);

  if (input.type === "password") {
    input.type = "text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  }
}

function changePassword() {
  const employeeId = localStorage.getItem("employeeId");

  const currentPassword = document.getElementById("currentPassword").value.trim();
  const newPassword = document.getElementById("newPassword").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (!employeeId) {
    alert("Please login again");
    window.location.href = "index.html";
    return;
  }

  if (!currentPassword) {
    alert("Please enter current password");
    return;
  }

  if (newPassword.length < 6) {
    alert("New password must be at least 6 characters");
    return;
  }
  const hasNumber = /\d/.test(newPassword);
  if (!hasNumber) {
    alert("New password must contain at least one number");
    return;
  }
  const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(newPassword);
  if (!hasSpecialChar) {
    alert("New password must contain at least one special character");
    return;
  }
  
  if (newPassword !== confirmPassword) {
    alert("New password and confirm password do not match");
    return;
  }

  if (currentPassword === newPassword) {
    alert("New password cannot be same as current password");
    return;
  }

  fetch(`${BASE_URL}/employee/change-password`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      employeeId: Number(employeeId),
      currentPassword: currentPassword,
      newPassword: newPassword
    })
  })
  .then(async response => {
    const text = await response.text();

    if (!response.ok) {
      throw new Error(text);
    }

   alert("Password changed successfully. Please login again.");

localStorage.clear();

window.location.href = "index.html";

    document.getElementById("currentPassword").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";
  })
  .catch(error => {
    console.error(error);
    alert(error.message || "Failed to change password");
  });
}
</script>

</body>
</html>
