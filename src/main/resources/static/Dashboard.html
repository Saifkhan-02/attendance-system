<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Employee Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f4f7fc;
    font-family:'Segoe UI',sans-serif;
}

/* HEADER */

.dashboard-header{
    background:linear-gradient(
    135deg,
    #0F4C81,
    #3A7BD5);

    color:white;

    padding:20px;

    border-radius:0 0 30px 30px;

    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.icon-btn{
    width:50px;
    height:50px;
    border:none;
    border-radius:15px;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:20px;
}

/* WELCOME */

.welcome-section{
    padding:25px 20px;
}

.welcome-section h1{
    font-weight:800;
}

/* CARDS */

.dashboard-card{
    background:white;

    border-radius:20px;

    padding:25px 10px;

    text-align:center;

    box-shadow:0 4px 15px rgba(0,0,0,.08);

    transition:.3s;

    cursor:pointer;

    height:100%;
}

.dashboard-card:hover{
    transform:translateY(-5px);
}

.icon-circle{
    width:70px;
    height:70px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin:auto;

    font-size:28px;
}

.bg1{background:#EAF4FF;}
.bg2{background:#FFF1E8;}
.bg3{background:#F0F8ED;}
.bg4{background:#FDEEF6;}

.dashboard-card h6{
    margin-top:15px;
    font-weight:600;
}

/* SUMMARY */

.summary-box{

    background:white;

    border-radius:25px;

    padding:25px;

    margin-top:30px;

    box-shadow:0 4px 15px rgba(0,0,0,.08);

}

.summary-box h2{
    font-weight:800;
}

.summary-box small{
    color:gray;
    font-weight:600;
}

/* MOBILE */

@media(max-width:768px){

    .dashboard-header h4{
        font-size:20px;
    }

    .welcome-section h1{
        font-size:32px;
    }

    .icon-circle{
        width:60px;
        height:60px;
        font-size:22px;
    }

}

</style>

</head>
<body>

<!-- HEADER -->

<div class="dashboard-header">

<div class="container">

<div class="d-flex justify-content-between align-items-center">

<button class="icon-btn">
<i class="fas fa-bars"></i>
</button>

<div class="text-center">

<h4 class="fw-bold mb-0">
EMPLOYEE PORTAL
</h4>

<small>
GPS Attendance System
</small>

</div>

<button class="icon-btn">
<i class="fas fa-bell"></i>
</button>

</div>

</div>

</div>

<!-- WELCOME -->

<div class="container">

<div class="welcome-section">

<h4 class="text-primary">
Welcome Back,
</h4>

<h3 id="employeeName"></h3>

<p class="text-muted">
Track your performance and field activity
</p>

</div>

</div>

<!-- FEATURES -->

<div class="container">

<div class="row g-3">

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg1">
<i class="fas fa-location-dot text-primary"></i>
</div>

<h6>Mark Attendance</h6>

</div>
</div>

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg2">
<i class="fas fa-clock text-warning"></i>
</div>

<h6>Check Out</h6>

</div>
</div>

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg4">
<i class="fas fa-user text-danger"></i>
</div>

<h6>Profile</h6>

</div>
</div>

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg3">
<i class="fas fa-earth-asia text-success"></i>
</div>

<h6>Live Location</h6>

</div>
</div>

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg4">
<i class="fas fa-calendar-days text-danger"></i>
</div>

<h6>Attendance History</h6>

</div>
</div>

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg1">
<i class="fas fa-plane-departure text-primary"></i>
</div>

<h6>Leave Request</h6>

</div>
</div>

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg3">
<i class="fas fa-chart-line text-success"></i>
</div>

<h6>Reports</h6>

</div>
</div>

<div class="col-6 col-md-3">
<div class="dashboard-card">

<div class="icon-circle bg2">
<i class="fas fa-gear text-warning"></i>
</div>

<h6>Settings</h6>

</div>
</div>

</div>

<!-- SUMMARY -->

<div class="summary-box">

<div class="row text-center">

<div class="col-4">

<h2>18</h2>

<small>
PRESENT
</small>

</div>

<div class="col-4">

<h2>2</h2>

<small>
LEAVES
</small>

</div>

<div class="col-4">

<h2 class="text-danger">
1
</h2>

<small>
ABSENT
</small>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const employeeName = localStorage.getItem("employeeName");

if(employeeName){

    document.getElementById("employeeName").innerText =
        "Welcome, " + employeeName;

}else{

    window.location.href = "index.html";

}

</script>

</body>
</html>
