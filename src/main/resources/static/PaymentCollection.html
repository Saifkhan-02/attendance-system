<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Collection</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
body{background:#f4f6fb}

.top-header{
  background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
  color:white;padding:22px;border-radius:0 0 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}
.back-btn{
  width:42px;height:42px;border:none;border-radius:50%;
  background:rgba(255,255,255,.2);color:white;
}
.main-card,.summary-card{
  border:none;border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.form-control,.form-select{border-radius:12px;padding:11px}
.amount-success{color:#198754;font-weight:800}
.amount-danger{color:#dc3545;font-weight:800}
.icon-box{
  width:52px;height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin:auto;font-size:23px;
}
.bg-sale{background:#dcfce7;color:#16a34a}
.bg-paid{background:#dbeafe;color:#2563eb}
.bg-due{background:#fee2e2;color:#dc2626}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">
    <button class="back-btn" onclick="window.location.href='SalesAndPayment.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Payment Collection</h2>
      <p class="mb-0">Update doctor due payments</p>
    </div>

    <div style="width:42px"></div>
  </div>
</div>

<div class="container py-4">

  <div class="card main-card mb-4">
    <div class="card-body p-4">
      <h4 class="fw-bold mb-3">
        <i class="fa-solid fa-user-doctor me-2 text-primary"></i>
        Select Doctor
      </h4>

      <label class="form-label fw-bold">Doctor</label>
      <select id="doctorSelect" class="form-select" onchange="showDoctorDue()">
        <option value="">Select Doctor</option>
      </select>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-sale mb-2">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <h6>Total Sale</h6>
          <h3 id="totalSale">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-6 col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-paid mb-2">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <h6>Received</h6>
          <h3 id="totalPaid">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-due mb-2">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <h6>Pending Due</h6>
          <h3 id="totalDue">₹0</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="card main-card">
    <div class="card-body p-4">
      <h4 class="fw-bold mb-3">
        <i class="fa-solid fa-money-bill-transfer me-2 text-primary"></i>
        Update Payment
      </h4>

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Payment Mode</label>
          <select id="paymentMode" class="form-select">
            <option value="">Select Payment Mode</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Cheque">Cheque</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Received Amount</label>
          <input type="number" id="receivedAmount" class="form-control" placeholder="Enter received amount">
        </div>

        <div class="col-md-12">
          <label class="form-label fw-bold">Remarks</label>
          <textarea id="remarks" class="form-control" rows="3" placeholder="Optional remarks"></textarea>
        </div>

        <div class="col-md-12">
          <button id="updatePaymentBtn" class="btn btn-primary w-100 btn-lg" onclick="updateDoctorPayment()">
            <i class="fa-solid fa-check me-2"></i>
            Update Payment
          </button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<!-- <script src="js/session-check.js"></script> -->

<script>
let allOrders = [];
let selectedDoctorOrders = [];

window.onload = function () {
  loadEmployeeOrders();
};

function loadEmployeeOrders() {
  const employeeId = localStorage.getItem("employeeId");

  fetch(`${BASE_URL}/order/history/${employeeId}`)
    .then(res => res.json())
    .then(data => {
      allOrders = data || [];
      loadDoctorDropdown();
    })
    .catch(error => {
      console.error(error);
      alert("Failed to load orders");
    });
}

function loadDoctorDropdown() {
  const dropdown = document.getElementById("doctorSelect");
  dropdown.innerHTML = `<option value="">Select Doctor</option>`;

  const dueOrders = allOrders.filter(o => Number(o.dueAmount || 0) > 0);

  const doctorMap = new Map();

  dueOrders.forEach(order => {
    if (order.doctorId) {
      doctorMap.set(order.doctorId, order.doctorName);
    }
  });

  doctorMap.forEach((name, id) => {
    dropdown.innerHTML += `
      <option value="${id}">
        ${name}
      </option>
    `;
  });
}

function showDoctorDue() {
  const doctorId = document.getElementById("doctorSelect").value;

  selectedDoctorOrders = allOrders.filter(order =>
    String(order.doctorId) === String(doctorId) &&
    Number(order.dueAmount || 0) > 0
  );

  const sale = selectedDoctorOrders.reduce((s,o) => s + Number(o.orderAmount || 0), 0);
  const paid = selectedDoctorOrders.reduce((s,o) => s + Number(o.paidAmount || 0), 0);
  const due = selectedDoctorOrders.reduce((s,o) => s + Number(o.dueAmount || 0), 0);

  document.getElementById("totalSale").innerText = formatRupees(sale);
  document.getElementById("totalPaid").innerText = formatRupees(paid);
  document.getElementById("totalDue").innerText = formatRupees(due);
}

function updateDoctorPayment() {
  const doctorId = document.getElementById("doctorSelect").value;
  const paymentMode = document.getElementById("paymentMode").value;
  const receivedAmount = Number(document.getElementById("receivedAmount").value || 0);

  if (!doctorId) {
    alert("Please select doctor");
    return;
  }

  if (!paymentMode) {
    alert("Please select payment mode");
    return;
  }

  if (receivedAmount <= 0) {
    alert("Please enter valid received amount");
    return;
  }

  const totalDue = selectedDoctorOrders.reduce((s,o) => s + Number(o.dueAmount || 0), 0);

  if (receivedAmount > totalDue) {
    alert("Received amount cannot be greater than due amount");
    return;
  }

  let remainingAmount = receivedAmount;
  const pendingOrders = selectedDoctorOrders
    .filter(o => Number(o.dueAmount || 0) > 0)
    .sort((a,b) => Number(a.id) - Number(b.id));

  const btn = document.getElementById("updatePaymentBtn");
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-2"></i>Updating...`;

  const requests = [];

  for (const order of pendingOrders) {
    if (remainingAmount <= 0) break;

    const orderDue = Number(order.dueAmount || 0);
    const payNow = Math.min(remainingAmount, orderDue);
    remainingAmount -= payNow;

    requests.push(
      fetch(`${BASE_URL}/order/collect-payment/${order.id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          receivedAmount: payNow,
          paymentMode: paymentMode,
          remarks: document.getElementById("remarks").value || ""
        })
      })
    );
  }

  Promise.all(requests)
    .then(async responses => {
      for (const res of responses) {
        if (!res.ok) {
          throw new Error(await res.text());
        }
      }

      alert("Payment updated successfully");

      document.getElementById("receivedAmount").value = "";
      document.getElementById("remarks").value = "";
      document.getElementById("paymentMode").value = "";

      loadEmployeeOrders();
      resetSummary();
    })
    .catch(error => {
      console.error(error);
      alert("Failed to update payment");
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-check me-2"></i>Update Payment`;
    });
}

function resetSummary() {
  document.getElementById("totalSale").innerText = "₹0";
  document.getElementById("totalPaid").innerText = "₹0";
  document.getElementById("totalDue").innerText = "₹0";
}

function formatRupees(amount) {
  return "₹" + Number(amount || 0).toLocaleString("en-IN");
}
</script>

</body>
</html>
