<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Tour Plans</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    background:#f4f6fb;
}

.page-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.badge-planned{
    background:#0d6efd;
}

.badge-approved{
    background:#198754;
}

.badge-rejected{
    background:#dc3545;
}

.table td,
.table th{
    vertical-align:middle;
}
</style>
</head>

<body>

<div class="page-header text-center">
    <h2 class="fw-bold mb-1">
        Tour Plan Requests
    </h2>
    <p class="mb-0">
        Approve or reject employee tour plans
    </p>
</div>

<div class="container py-4">

    <div class="card">
        <div class="card-body">

            <h4 class="fw-bold mb-4">
                All Tour Plans
            </h4>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-primary">
                        <tr>
                            <th>Employee ID</th>
                            <th>Employee Name</th>
                            <th>Tour Date</th>
                            <th>HQ</th>
                            <th>Area</th>
                            <th>Purpose</th>
                            <th>Remarks</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="tourPlanTable"></tbody>

                </table>

            </div>

        </div>
    </div>

</div>

<script src="js/config.js"></script>

<script>

window.onload = loadTourPlans;

function loadTourPlans(){

    fetch(`${BASE_URL}/admin/tour-plans`)

    .then(response => response.json())

    .then(data => {

        const table =
            document.getElementById("tourPlanTable");

        table.innerHTML = "";

        if(data.length === 0){

            table.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center">
                        No Tour Plans Found
                    </td>
                </tr>
            `;

            return;
        }

        data.forEach(plan => {

            let badgeClass = "badge-planned";

            if(plan.status === "Approved"){
                badgeClass = "badge-approved";
            }

            if(plan.status === "Rejected"){
                badgeClass = "badge-rejected";
            }

            let actionButtons = "-";

            if(plan.status === "Planned"){

                actionButtons = `
                    <button
                        class="btn btn-success btn-sm me-1"
                        onclick="approveTourPlan(${plan.id})">
                        Approve
                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        onclick="rejectTourPlan(${plan.id})">
                        Reject
                    </button>
                `;
            }

            table.innerHTML += `
                <tr>
                    <td>${plan.employeeId || "-"}</td>
                    <td>${plan.employeeName || "-"}</td>
                    <td>${plan.tourDate || "-"}</td>
                    <td>${plan.hq || "-"}</td>
                    <td>${plan.area || "-"}</td>
                    <td>${plan.purpose || "-"}</td>
                    <td>${plan.remarks || "-"}</td>
                    <td>
                        <span class="badge ${badgeClass}">
                            ${plan.status || "Planned"}
                        </span>
                    </td>
                    <td>${actionButtons}</td>
                </tr>
            `;
        });
    })
    .catch(error => {
        console.error(error);
        alert("Failed to load tour plans");
    });
}

function approveTourPlan(id){

    fetch(`${BASE_URL}/tour-plan/approve/${id}`, {
        method:"PUT"
    })

    .then(response => response.text())

    .then(data => {
        alert(data);
        loadTourPlans();
    });
}

function rejectTourPlan(id){

    fetch(`${BASE_URL}/tour-plan/reject/${id}`, {
        method:"PUT"
    })

    .then(response => response.text())

    .then(data => {
        alert(data);
        loadTourPlans();
    });
}

</script>

</body>
</html>
