
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#f4f6fb;
}

.profile-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:30px;
    border-radius:20px;
}

.profile-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.profile-img{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #fff;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.info-box{
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.05);
    height:100%;
}

.info-label{
    font-size:13px;
    color:#6c757d;
    margin-bottom:5px;
}

.info-value{
    font-weight:600;
    font-size:16px;
}

.action-btn{
    border-radius:12px;
}

@media(max-width:768px){

    .profile-header{
        text-align:center;
    }

    .profile-img{
        width:120px;
        height:120px;
    }

}
</style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<body>

<div class="container py-4">

    <div class="profile-header mb-4">

        <div class="row align-items-center">

            <div class="col-md-3 text-center">

                <img src="https://via.placeholder.com/150"
                     class="profile-img">

            </div>

            <div class="col-md-9 mt-3 mt-md-0">

                <h2 class="fw-bold mb-2" id="employeeNameHeader">
                    Loading...
                </h2>

                <p class="mb-1" id="employeeDesignation">
                   Loading...
                </p>

                <p class="mb-0">
                    Employee ID : 
                    <span id="employeeId"></span>
                </p>

            </div>

        </div>

    </div>

    <div class="card profile-card">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">

                <h4 class="fw-bold mb-0">
                    Profile Information
                </h4>

                <button class="btn btn-primary action-btn">
                    <i class="fa-solid fa-pen-to-square me-2"></i>
                    Edit Profile
                </button>

            </div>

            <div class="row g-4">

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Full Name</div>
                        <div class="info-value" id="employeeName"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Email</div>
                        <div class="info-value" id="employeeEmail">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Mobile Number</div>
                        <div class="info-value" id="employeeMobile">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Designation</div>
                        <div class="info-value" id="employeeDesignation">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Head Quarter</div>
                        <div class="info-value" id="employeeHeadQuarter">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Reporting Manager</div>
                        <div class="info-value" id="reportingManager">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Joining Date</div>
                        <div class="info-value" id="employeeJoiningDate">
                            Loading...
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="info-label">Status</div>
                        <div class="info-value text-success" id="employeeStatus">
                            Active
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/config.js"></script>

<script>

   window.onload = loadProfile;

function loadProfile() {

    const employeeId =
        localStorage.getItem("employeeId");

    if (!employeeId) {
        alert("Please log in first.");
        window.location.href = "index.html";
        return;
    }

    fetch(`/employee/${employeeId}`)

    .then(response => {

        if (!response.ok) {
            throw new Error("Employee not found");
        }

        return response.json();
    })

    .then(employee => {

        //Header Info
       
        document.getElementById("employeeNameHeader")
                .innerText = employee.name;

         document.getElementById("employeeName")
                .innerText = employee.name;

        document.getElementById("employeeId")
                .innerText = employee.id;

        document.getElementById("employeeEmail")
                .innerText = employee.email;

        document.getElementById("employeeMobile")
                .innerText = employee.mobile;

        document.getElementById("employeeDesignation")
                .innerText = employee.designation;

        document.getElementById("employeeHeadQuarter")
                .innerText = employee.headQuarter;

        document.getElementById("reportingManager")
                .innerText = employee.reportingManager;

        document.getElementById("employeeJoiningDate")
                .innerText = employee.joiningDate;

        document.getElementById("employeeStatus")
                .innerText = employee.status;
    })

    .catch(error => {

        console.error(error);

        alert("Unable to load profile");
    });
}
</script>

</body>
</html>
```
