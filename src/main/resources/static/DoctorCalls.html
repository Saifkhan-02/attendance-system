<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Doctor Calls</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      body {
        background: #f4f6fb;
      }

      .top-header {
        background: linear-gradient(135deg, #0d4f9c, #3f7fe0);
        color: white;
        padding: 25px;
        border-radius: 0 0 25px 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }
      .back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.back-btn:hover{
  background:rgba(255,255,255,.3);
}
      .doctor-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        transition: 0.3s;
        cursor: pointer;
      }

      .doctor-card:hover {
        transform: translateY(-5px);
      }

      .icon-box {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background: #e9f2ff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0d6efd;
        font-size: 24px;
      }

      .detail-label {
        font-size: 13px;
        color: #6c757d;
      }

      .detail-value {
        font-weight: 600;
      }

      .btn-call {
        background: #198754;
        color: white;
        border-radius: 12px;
        padding: 12px;
        font-weight: 600;
      }

      .btn-call:hover {
        background: #157347;
        color: white;
      }
    </style>
  </head>

  <body>
<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">

    <button class="back-btn"
            onclick="window.location.href='Dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Doctor's List</h2>
      <p class="mb-0">List of all doctors you have visited</p>
    </div>

    <div style="width:42px"></div>

  </div>
</div>

    <div class="container py-4">
      <div class="row g-3 mb-4">
        <div class="col-md-8">
          <input
            type="text"
            id="searchDoctor"
            class="form-control"
            placeholder="Search doctor by name or area..."
            onkeyup="searchDoctors()"
          />
        </div>

        <div class="col-md-4">
          <div class="d-flex gap-2">
            <button class="btn btn-primary flex-fill" onclick="loadDoctors()">
              <i class="fa-solid fa-rotate-right me-2"></i>
              Refresh
            </button>

            <button
              class="btn btn-outline-primary flex-fill"
              onclick="openCallHistory()">
              <i class="fa-solid fa-clock-rotate-left me-2"></i>
              History
            </button>
          </div>
        </div>
      </div>
<div id="doctorSection">
      <div class="row g-4" id="doctorList">
        <!-- Dynamic doctors will load here -->
      </div>
      </div>
    </div>

    <div id="historySection" style="display:none;">

    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h4 class="fw-bold mb-0">
                    Call History
                </h4>

                <button class="btn btn-outline-secondary btn-sm"
                        onclick="showDoctors()">

                    Back

                </button>

            </div>

            <div class="table-responsive">

                <table class="table table-hover">

                    <thead class="table-primary">

                        <tr>

                            <th>Dr. Name</th>
                            <th>Phone</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="callHistoryTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

    <!-- Doctor Detail Modal -->
    <div class="modal fade" id="doctorModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="modalDoctorName">
              Doctor Details
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <div class="detail-label">Specialization</div>
              <div class="detail-value" id="modalSpecialization">-</div>
            </div>

            <div class="mb-3">
              <div class="detail-label">Hospital / Clinic</div>
              <div class="detail-value" id="modalHospital">-</div>
            </div>

            <!-- <div class="mb-3">
              <div class="detail-label">Mobile</div>
              <div class="detail-value" id="modalMobile">-</div>
            </div> -->

            <div class="mb-3">
              <div class="detail-label">Landmark/Area</div>
              <div class="detail-value" id="modalArea">-</div>
            </div>

            <div class="mb-3">
              <div class="detail-label">Location</div>
              <div class="detail-value" id="modalLocation">-</div>
            </div>


            <div class="mb-3">
    <div class="detail-label">DOB</div>
    <div class="detail-value" id="modalDob">-</div>
</div>

<div class="mb-3">
    <div class="detail-label">Anniversary Date</div>
    <div class="detail-value" id="modalAnniversary">-</div>
</div>

<div class="mb-3">
    <div class="detail-label">Last Visit Date</div>
    <div class="detail-value" id="modalVisitDate">-</div>
</div>

            <a id="callNowBtn" href="#">
             
            
            </a>
          </div>
        </div>
      </div>
    </div>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <!-- <script src="js/session-check.js"></script> -->

    <script>
      let doctors = [];
      let currentDoctorList = [];
      window.onload = loadDoctors;

      function loadDoctors() {
        const employeeId = localStorage.getItem("employeeId");

        fetch(`${BASE_URL}/doctor-visit/unique-doctors/${employeeId}`)
          .then((response) => response.json())
          .then((data) => {
            doctors = data;
            displayDoctors(doctors);
          });
          
      }

      function displayDoctors(list) {
    const container = document.getElementById("doctorList");

    container.innerHTML = "";
    currentDoctorList = list;

    if (!list || list.length === 0) {
        container.innerHTML = `
            <div class="col-12">
                <div class="alert alert-warning text-center">
                    No doctors found
                </div>
            </div>
        `;
        return;
    }

    list.forEach((doctor, index) => {
        container.innerHTML += `
            <div class="col-md-6 col-lg-4">
                <div class="card doctor-card h-100"
                     onclick="openDoctorFromList(${index})">

                    <div class="card-body">

                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="icon-box">
                                <i class="fa-solid fa-user-doctor"></i>
                            </div>

                            <div>
                                <h5 class="fw-bold mb-1">
                                    ${doctor.doctorName || "-"}
                                </h5>
                                <p class="text-muted mb-0">
                                    ${doctor.specialization || "-"}
                                </p>
                            </div>
                        </div>

                        <p class="mb-1">
                            <i class="fa-solid fa-hospital me-2 text-primary"></i>
                            ${doctor.hospitalName || "-"}
                        </p>

                        <p class="mb-1">
                            <i class="fa-solid fa-location-dot me-2 text-danger"></i>
                            ${doctor.landmark || doctor.location || "-"}
                        </p>

                        

                        <p class="mb-0">
                            <i class="fa-solid fa-calendar me-2 text-success"></i>
                            ${doctor.visitDate || "-"}
                        </p>

                    </div>
                </div>
            </div>
        `;
    });
}
function openDoctorFromList(index) {
    const doctor = currentDoctorList[index];

    if (!doctor) {
        alert("Doctor details not found");
        return;
    }

    openDoctorModal(doctor);
}
 function openDoctorModal(doctor) {
    document.getElementById("modalDoctorName").innerText =
        doctor.doctorName || "-";

    document.getElementById("modalSpecialization").innerText =
        doctor.specialization || "-";

    document.getElementById("modalHospital").innerText =
        doctor.hospitalName || "-";

    //document.getElementById("modalMobile").innerText =
      //  doctor.mobile || doctor.phone || "-";

    document.getElementById("modalArea").innerText =
        doctor.landmark || "-";

    document.getElementById("modalLocation").innerText =
        doctor.location || "-";

    document.getElementById("modalDob").innerText =
        doctor.dob || "-";

    document.getElementById("modalAnniversary").innerText =
        doctor.anniversaryDate || "-";

    document.getElementById("modalVisitDate").innerText =
        doctor.visitDate || "-";

    const mobile = doctor.mobile || doctor.phone;

    document.getElementById("callNowBtn").href =
        mobile ? `tel:${mobile}` : "#";

    const modal = new bootstrap.Modal(
        document.getElementById("doctorModal")
    );

    modal.show();
}      

      function searchDoctors() {
        const keyword = document
          .getElementById("searchDoctor")
          .value.toLowerCase();

        const filtered = doctors.filter(
          (doctor) =>
            doctor.doctorName.toLowerCase().includes(keyword) ||
           (doctor.landmark || doctor.location || "").toLowerCase().includes(keyword) ||
            doctor.specialization.toLowerCase().includes(keyword),
        );

        displayDoctors(filtered);
      }

      function openCallHistory() {
        document.getElementById("doctorSection").style.display = "none";
        document.getElementById("historySection").style.display = "block";
        loadCallHistory();
      }

      function showDoctors() {
        document.getElementById("historySection").style.display = "none";
        document.getElementById("doctorSection").style.display = "block";
      }
    </script>
  </body>
</html>
