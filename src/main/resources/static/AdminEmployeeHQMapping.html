<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee headquarter Mapping</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{background:#f4f6fb}

.top-header{
  background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
  color:white;
  padding:25px;
  border-radius:0 0 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.admin-card,.summary-card{
  border:none;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,.form-select{
  border-radius:12px;
  padding:12px;
}

.summary-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:22px;
}

.icon-blue{background:#e9f2ff;color:#0d6efd}
.icon-green{background:#eafaf1;color:#198754}
.icon-orange{background:#fff4e5;color:#fd7e14}

.table td{vertical-align:middle}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <h2 class="fw-bold mb-1">Employee headquarter Mapping</h2>
      <p class="mb-0">Assign headquarters to employees</p>
    </div>

    <a href="AdminHQManagement.html" class="btn btn-light fw-semibold">
      <i class="fa-solid fa-arrow-left me-2"></i>
      Back to headquarter
    </a>
  </div>
</div>

<div class="container py-4">

  <div class="row g-3 mb-4">

    <div class="col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="summary-icon icon-blue mb-2">
            <i class="fa-solid fa-users"></i>
          </div>
          <h6 class="text-muted">Total Employees</h6>
          <h3 class="fw-bold" id="totalEmployees">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="summary-icon icon-green mb-2">
            <i class="fa-solid fa-map-location-dot"></i>
          </div>
          <h6 class="text-muted">Total headquarter</h6>
          <h3 class="fw-bold" id="totalheadquarter">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="summary-icon icon-orange mb-2">
            <i class="fa-solid fa-link"></i>
          </div>
          <h6 class="text-muted">Total Mappings</h6>
          <h3 class="fw-bold" id="totalMappings">0</h3>
        </div>
      </div>
    </div>

  </div>

  <div class="card admin-card mb-4">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-4">
        <i class="fa-solid fa-user-plus me-2 text-primary"></i>
        Assign Headquarter
      </h5>

      <div class="row g-3 align-items-end">

        <div class="col-md-5">
          <label class="form-label">Employee</label>
          <select id="employeeSelect" class="form-select">
            <option value="">Select Employee</option>
          </select>
        </div>

        <div class="col-md-5">
          <label class="form-label">Headquarter</label>
          <select id="headquarterSelect" class="form-select">
            <option value="">Select Headquarter</option>
          </select>
        </div>

        <div class="col-md-2">
          <button class="btn btn-primary w-100" onclick="assignheadquarter()">
            <i class="fa-solid fa-check me-2"></i>
            Assign
          </button>
        </div>

      </div>
    </div>
  </div>

  <div class="card admin-card">
    <div class="card-body p-4">

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h5 class="fw-bold mb-0">
          <i class="fa-solid fa-list me-2 text-primary"></i>
          Employee headquarter Mapping List
        </h5>

        <input type="text"
               id="searchMapping"
               class="form-control w-auto"
               placeholder="Search employee..."
               oninput="filterMappingRows()">
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-primary">
            <tr>
              <th>ID</th>
              <th>Employee</th>
              <th>Headquarter</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="mappingTableBody"></tbody>
        </table>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>
window.onload = function () {
  loadEmployees();
  loadheadquarters();
 
};

async function loadEmployees() {
  const response = await fetch(`${BASE_URL}/get-employees`);
  const employees = await response.json();

  document.getElementById("totalEmployees").innerText = employees.length;

  const dropdown = document.getElementById("employeeSelect");
  dropdown.innerHTML = `<option value="">Select Employee</option>`;

  employees.forEach(emp => {
    dropdown.innerHTML += `
      <option value="${emp.id}">
        ${emp.name}
      </option>
    `;
  });
}

async function loadheadquarters() {
  const response = await fetch(`${BASE_URL}/headquarter/active`);
  const headquarters = await response.json();

  document.getElementById("totalheadquarter").innerText = headquarters.length;

  const dropdown = document.getElementById("headquarterSelect");
  dropdown.innerHTML = `<option value="">Select Headquarter</option>`;

  headquarters.forEach(headquarter => {
    dropdown.innerHTML += `
      <option value="${headquarter.id}">
        ${headquarter.headquarterName}
      </option>
    `;
  });
}

async function assignheadquarter() {
  const employeeId = document.getElementById("employeeSelect").value;
  const hqSelect = document.getElementById("headquarterSelect");
  const headquarterName = hqSelect.options[hqSelect.selectedIndex].text;

  if (!employeeId) {
    alert("Please select employee");
    return;
  }

  if (!hqSelect.value) {
    alert("Please select headquarter");
    return;
  }

  const response = await fetch(`${BASE_URL}/employee/assign-headquarter`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      employeeId: Number(employeeId),
      headquarterName: headquarterName
    })
  });

  if (response.ok) {
    alert("Headquarter assigned successfully");
    loadEmployees();
  } else {
    alert("Failed to assign headquarter");
  }
}


async function deleteMapping(id) {
  if (!confirm("Delete this mapping?")) {
    return;
  }

  const response = await fetch(`${BASE_URL}/headquarter/mapping/delete/${id}`, {
    method: "DELETE"
  });

  if (response.ok) {
    alert("Mapping Deleted Successfully");
    loadMappings();
  } else {
    alert("Failed to delete mapping");
  }
}

function filterMappingRows() {
  const search = document.getElementById("searchMapping").value.toLowerCase();
  const rows = document.querySelectorAll("#mappingTableBody tr");

  rows.forEach(row => {
    if (!row.cells[1]) return;

    const employeeName = row.cells[1].innerText.toLowerCase();

    row.style.display =
      employeeName.includes(search) ? "" : "none";
  });
}
</script>

</body>
</html>
