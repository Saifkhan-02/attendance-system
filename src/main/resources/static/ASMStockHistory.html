<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASM Stock History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/asm-common.css">

<style>
.summary-card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}
.summary-card i{
  font-size:24px;
  color:#0d6efd;
}
.summary-card h4{
  font-weight:900;
  margin:8px 0 0;
}
.status-active{color:#198754;font-weight:700}
.status-low{color:#fd7e14;font-weight:700}
.status-out{color:#dc3545;font-weight:700}
</style>
</head>

<body>

<div class="asm-container">

  <div class="asm-card">
    <h4 class="fw-bold mb-3">
      <i class="fa-solid fa-boxes-stacked text-primary me-2"></i>
      Distributor Stock History
    </h4>

    <div class="row g-3">
      <div class="col-6 col-md-6">
        <label class="form-label fw-semibold">Select Headquarter</label>
        <select id="hqSelect" class="form-select" onchange="loadDistributors()">
          <option value="">Select Headquarter</option>
        </select>
      </div>

      <div class="col-6 col-md-6">
        <label class="form-label fw-semibold">Select Distributor</label>
        <select id="distributorSelect" class="form-select" onchange="loadStock()">
          <option value="">Select Distributor</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-md-4">
      <div class="summary-card text-center">
        <i class="fa-solid fa-truck-field"></i>
        <div>Total Distributors</div>
        <h4 id="totalDistributors">0</h4>
      </div>
    </div>

    <div class="col-6 col-md-4">
      <div class="summary-card text-center">
        <i class="fa-solid fa-capsules"></i>
        <div>Total Products</div>
        <h4 id="totalProducts">0</h4>
      </div>
    </div>

    <div class="col-12 col-md-4">
      <div class="summary-card text-center">
        <i class="fa-solid fa-cubes"></i>
        <div>Total Units</div>
        <h4 id="totalUnits">0</h4>
      </div>
    </div>
  </div>

  <div class="asm-card">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <div>
        <h4 class="fw-bold mb-1">Stock List</h4>
        <p class="text-muted mb-0">Selected distributor current stock</p>
      </div>

      <button class="btn btn-outline-primary" onclick="loadStock()">
        <i class="fa-solid fa-rotate-right me-1"></i>
        Refresh
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-light">
          <tr>
            <th>Headquarter</th>
            <th>Distributor</th>
            <th>Product</th>
            <th>Available Units</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="stockTable">
          <tr>
            <td colspan="5" class="text-center text-muted">
              Select headquarter and distributor
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/asm-common.js"></script>

<script>
if (checkAsmSession()) {
  renderAsmSidebar("stock");
  renderAsmHeader("Stock History", true, "ASMDashboard.html");
}

const asmId = getAsmId();

let distributors = [];
let stockList = [];

window.onload = function(){
  loadAssignedHeadquarters();
};

function loadAssignedHeadquarters(){
  fetch(`${BASE_URL}/asm/headquarters/${asmId}`)
    .then(res => res.json())
    .then(hqs => {
      const select = document.getElementById("hqSelect");
      select.innerHTML = `<option value="">Select Headquarter</option>`;

      if(!hqs || hqs.length === 0){
        select.innerHTML = `<option value="">No assigned HQ found</option>`;
        return;
      }

      hqs.forEach(hq => {
        select.innerHTML += `<option value="${hq}">${hq}</option>`;
      });
    })
    .catch(err => {
      console.error(err);
      alert("Failed to load assigned headquarters");
    });
}

function loadDistributors(){
  const hq = document.getElementById("hqSelect").value;
  const distSelect = document.getElementById("distributorSelect");

  distSelect.innerHTML = `<option value="">Select Distributor</option>`;
  document.getElementById("totalDistributors").innerText = 0;
  resetStockTable();

  if(!hq) return;

  fetch(`${BASE_URL}/distributor/by-headquarter/${encodeURIComponent(hq)}`)
    .then(res => res.json())
    .then(data => {
      distributors = data || [];
      document.getElementById("totalDistributors").innerText = distributors.length;

      distributors.forEach(d => {
        distSelect.innerHTML += `
          <option value="${d.id}">
            ${d.distributorName}
          </option>
        `;
      });
    })
    .catch(err => {
      console.error(err);
      alert("Failed to load distributors");
    });
}

function loadStock(){
  const distributorId = document.getElementById("distributorSelect").value;

  if(!distributorId){
    resetStockTable();
    return;
  }

  fetch(`${BASE_URL}/distributor-stock/${distributorId}`)
    .then(res => res.json())
    .then(data => {
      stockList = data || [];
      renderStock(stockList);
    })
    .catch(err => {
      console.error(err);
      alert("Failed to load stock");
    });
}

function renderStock(data){
  const table = document.getElementById("stockTable");
  table.innerHTML = "";

  document.getElementById("totalProducts").innerText = data.length;

  let totalUnits = 0;

  if(!data || data.length === 0){
    document.getElementById("totalUnits").innerText = 0;
    table.innerHTML = `
      <tr>
        <td colspan="5" class="text-center text-muted">
          No stock found for selected distributor
        </td>
      </tr>
    `;
    return;
  }

  data.forEach(item => {
    const qty = Number(item.availableUnits || 0);
    totalUnits += qty;

    let statusText = "In Stock";
    let statusClass = "status-active";

    if(qty <= 0){
      statusText = "Out of Stock";
      statusClass = "status-out";
    } else if(qty <= 20){
      statusText = "Low Stock";
      statusClass = "status-low";
    }

    table.innerHTML += `
      <tr>
        <td>${item.headquarters || "-"}</td>
        <td>${item.distributorName || "-"}</td>
        <td><strong>${item.productName || "-"}</strong></td>
        <td>${qty.toLocaleString("en-IN")}</td>
        <td><span class="${statusClass}">${statusText}</span></td>
      </tr>
    `;
  });

  document.getElementById("totalUnits").innerText =
    totalUnits.toLocaleString("en-IN");
}

function resetStockTable(){
  document.getElementById("totalProducts").innerText = 0;
  document.getElementById("totalUnits").innerText = 0;
  document.getElementById("stockTable").innerHTML = `
    <tr>
      <td colspan="5" class="text-center text-muted">
        Select headquarter and distributor
      </td>
    </tr>
  `;
}
</script>

</body>
</html>
