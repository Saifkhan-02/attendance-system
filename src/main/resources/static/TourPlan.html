<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tour Plan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    background:#f4f6fb;
}

.top-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.tour-card,
.history-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
}

.btn-submit{
    background:#0d6efd;
    border:none;
    border-radius:12px;
    padding:12px 30px;
}

.btn-submit:hover{
    background:#0b5ed7;
}

.status-planned{
    color:#198754;
    font-weight:600;
}

.status-completed{
    color:#2a25ab;
    font-weight:600;
}

.status-cancelled{
    color:#dc3545;
    font-weight:600;
}
</style>
</head>

<body>

<div class="top-header text-center">
    <h2 class="fw-bold mb-1">Tour Plan</h2>
    <p class="mb-0">Create and track your field tour plans</p>
</div>

<div class="container py-4">

    <!-- Tour Plan Form -->
    <div class="card tour-card">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-4">Create Tour Plan</h4>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Tour Date</label>
                    <input type="date" id="tourDate" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">HQ</label>
                    <input type="text" id="hq" class="form-control" placeholder="Enter HQ">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Area</label>
                    <input type="text" id="area" class="form-control" placeholder="Enter Area / City">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Purpose</label>
                    <select id="purpose" class="form-select">
                        <option>Doctor Visit</option>
                        <option>Chemist Visit</option>
                        <option>Stockist Visit</option>
                        <option>Hospital Visit</option>
                        <option>Market Survey</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label">Remarks</label>
                    <textarea id="remarks" rows="4" class="form-control" placeholder="Enter remarks"></textarea>
                </div>

                <div class="col-md-12">
                    <button class="btn btn-submit text-white" onclick="submitTourPlan()">
                        <i class="fa-solid fa-paper-plane me-2"></i>
                        Submit Tour Plan
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- Tour Plan History -->
    <div class="card history-card mt-4">
        <div class="card-body">

            <h4 class="fw-bold mb-4">Tour Plan History</h4>

            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-primary">
                        <tr>
                            <th>Tour Date</th>
                            <th>HQ</th>
                            <th>Area</th>
                            <th>Purpose</th>
                            <th>Remarks</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="tourHistoryTable"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>
window.onload = loadTourHistory;

function submitTourPlan() {

    const tourData = {
        employeeId: localStorage.getItem("employeeId"),
        employeeName: localStorage.getItem("employeeName"),
        tourDate: document.getElementById("tourDate").value,
        hq: document.getElementById("hq").value,
        area: document.getElementById("area").value,
        purpose: document.getElementById("purpose").value,
        remarks: document.getElementById("remarks").value
    };

    fetch(`${BASE_URL}/tour-plan/save`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(tourData)
    })
    .then(response => response.json())
    .then(data => {
        alert("Tour Plan Submitted Successfully");

        document.getElementById("tourDate").value = "";
        document.getElementById("hq").value = "";
        document.getElementById("area").value = "";
        document.getElementById("purpose").selectedIndex = 0;
        document.getElementById("remarks").value = "";

        loadTourHistory();
    })
    .catch(error => {
        console.error(error);
        alert("Failed to submit tour plan");
    });
}

function loadTourHistory() {

    const employeeId = localStorage.getItem("employeeId");

    fetch(`${BASE_URL}/tour-plan/history/${employeeId}`)
    .then(response => response.json())
    .then(data => {

        const table = document.getElementById("tourHistoryTable");
        table.innerHTML = "";

        if (data.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center">
                        No Tour Plans Found
                    </td>
                </tr>
            `;
            return;
        }

        data.forEach(tour => {

            let statusClass = "status-planned";

            if (tour.status === "Completed") {
                statusClass = "status-completed";
            }

            if (tour.status === "Cancelled") {
                statusClass = "status-cancelled";
            }

            table.innerHTML += `
                <tr>
                    <td>${tour.tourDate || "-"}</td>
                    <td>${tour.hq || "-"}</td>
                    <td>${tour.area || "-"}</td>
                    <td>${tour.purpose || "-"}</td>
                    <td>${tour.remarks || "-"}</td>
                    <td>
                        <span class="${statusClass}">
                            ${tour.status || "Planned"}
                        </span>
                    </td>
                </tr>
            `;
        });
    })
    .catch(error => {
        console.error(error);
    });
}
</script>

</body>
</html>
