<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment History</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">

<style>
body{background:#f4f6fb}

.top-header{
  background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
  color:white;
  padding:22px;
  border-radius:0 0 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.main-card,.summary-card{
  border:none;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.icon-box{
  width:52px;
  height:52px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:23px;
}

.bg-pay{background:#dcfce7;color:#16a34a}
.bg-count{background:#dbeafe;color:#2563eb}
.bg-mode{background:#fff4e5;color:#f59e0b}
.bg-doctor{background:#fee2e2;color:#dc2626}

.form-control,.form-select{
  border-radius:12px;
  padding:11px;
}

.table-scroll{
  max-height:520px;
  overflow:auto;
}

.table-scroll thead th{
  position:sticky;
  top:0;
  z-index:5;
  background:#0d6efd!important;
  color:white!important;
}

th,td{
  white-space:nowrap;
  vertical-align:middle;
}

.amount-success{
  color:#198754;
  font-weight:800;
}

@media(max-width:768px){
  h2{font-size:22px}
}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">
    <button class="back-btn" onclick="window.location.href='AdminSalesPayment.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">
        <i class="fa-solid fa-money-bill-transfer me-2"></i>
        Payment History
      </h2>
      <p class="mb-0">Track due collection and received payments</p>
    </div>

    <div style="width:42px"></div>
  </div>
</div>

<div class="container py-4">

  <div class="card main-card mb-4">
    <div class="card-body p-4">
      <h4 class="fw-bold mb-3">
        <i class="fa-solid fa-filter me-2 text-primary"></i>
        Filter Payments
      </h4>

      <div class="row g-3">

  <div class="col-6 col-md-6">
    <label class="form-label fw-bold">Employee</label>
    <select id="employeeFilter" class="form-select">
      <option value="">All Employees</option>
    </select>
  </div>

  <div class="col-6 col-md-6">
    <label class="form-label fw-bold">Month</label>
    <input type="month" id="filterMonth" class="form-control">
  </div>

  <div class="col-6 col-md-6">
    <label class="form-label fw-bold">Doctor</label>
    <select id="doctorFilter" class="form-select">
      <option value="">All Doctors</option>
    </select>
  </div>

  <div class="col-6 col-md-6">
    <label class="form-label fw-bold">Payment Mode</label>
    <select id="modeFilter" class="form-select">
      <option value="">All Modes</option>
      <option value="Cash">Cash</option>
      <option value="UPI">UPI</option>
      <option value="Cheque">Cheque</option>
      <option value="Bank Transfer">Bank Transfer</option>
    </select>
  </div>

  <div class="col-6 col-md-6">
    <button class="btn btn-primary w-100" onclick="applyFilters()">
      Search
    </button>
  </div>

  <div class="col-6 col-md-6">
    <button class="btn btn-secondary w-100" onclick="resetFilters()">
      Reset
    </button>
  </div>

      </div>
 
    </div>
  </div>

  <!-- cards -->
  <div class="row g-3 mb-4">
    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-count mb-2">
            <i class="fa-solid fa-list"></i>
          </div>
          <h6>Total Collection</h6>
          <h3 id="totalReceived">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-pay mb-2">
            <i class="fa-solid fa-indian-rupee-sign"></i>
          </div>
          <h6>Total Due</h6>
          <h3 id="totalDue">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-doctor mb-2">
            <i class="fa-solid fa-user-doctor"></i>
          </div>
          <h6>Doctors</h6>
          <h3 id="totalDoctors">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-3 col-6">
      <div class="card summary-card">
        <div class="card-body text-center">
          <div class="icon-box bg-mode mb-2">
            <i class="fa-solid fa-wallet"></i>
          </div>
          <h6>Total Sale</h6>
          <h3 id="totalSale">₹0</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="card main-card">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h4 class="fw-bold mb-0">
          <i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>
          Payment Collection Records
        </h4>

        <button class="btn btn-outline-primary btn-sm" onclick="loadPaymentHistory()">
          <i class="fa-solid fa-rotate-right me-2"></i>
          Refresh
        </button>
      </div>

      <div class="table-scroll">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>S.No</th>
              <th>Date</th>
              
              <th>Employee</th>
              <th>Doctor</th>
              <th>Amount</th>
              <th>Received</th>
              <th>Due</th>
              <th>Pay Mode</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="paymentHistoryTable"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="js/config.js"></script>

<script>
let allPayments = [];
let employeeChoices = null;
window.onload = function () {
  document.getElementById("filterMonth").value =
    new Date().toISOString().slice(0, 7);

  loadEmployees();
  loadPaymentHistory();
};

function loadEmployees() {
  fetch(`${BASE_URL}/get-employees`)
    .then(res => res.json())
    .then(data => {
      const dropdown = document.getElementById("employeeFilter");

      dropdown.innerHTML ="";

      (data || []).forEach(emp => {
        dropdown.innerHTML += `
          <option value="${emp.name}">
            ${emp.name}
          </option>
        `;
      });
      if (employeeChoices) {
    employeeChoices.destroy();
}

employeeChoices = new Choices("#employeeFilter", {
    searchEnabled: true,
    itemSelectText: "",
    shouldSort: false
});
    })
    .catch(error => {
      console.error("Employee load error:", error);
    });
}
function loadPaymentHistory() {
  fetch(`${BASE_URL}/order/admin/all`)
    .then(res => res.json())
    .then(data => {
      allPayments = data || [];

      loadDoctorDropdown(allPayments);
      applyFilters();
      
    })
    .catch(error => {
      console.error(error);
      alert("Failed to load payment history");
    });
}

function loadDoctorDropdown(data){

  const doctorFilter =
    document.getElementById("doctorFilter");

  doctorFilter.innerHTML =
    `<option value="">All Doctors</option>`;

  const doctors =
    [...new Set(
      data.map(x => x.doctorName)
    )];

  doctors.forEach(doc => {

    doctorFilter.innerHTML += `
      <option value="${doc}">
        ${doc}
      </option>
    `;
  });
}
function applyFilters() {
  const month = document.getElementById("filterMonth").value;
  const employeeValue = document.getElementById("employeeFilter").value;
  const doctorText = document.getElementById("doctorFilter").value.toLowerCase();
  const mode = document.getElementById("modeFilter").value;

  const filtered = allPayments.filter(p => {
    const paymentDate = p.orderDate || "";

    const monthMatch =
      !month || paymentDate.startsWith(month);

    const employeeMatch =
      !employeeValue ||
      String(p.employeeId || "") === String(employeeValue) ||
      (p.employeeName || "") === employeeValue;

    const doctorMatch =
      !doctorText ||
      (p.doctorName || "").toLowerCase().includes(doctorText);

    const modeMatch =
      !mode || (p.paymentMode || "") === mode;

    return monthMatch && employeeMatch && doctorMatch && modeMatch;
  });

  renderSummary(filtered);
  renderTable(filtered);
}

function renderSummary(data){

  const totalSale =
    data.reduce((sum,p) =>
      sum + Number(p.orderAmount || 0), 0);

  const totalReceived =
    data.reduce((sum,p) =>
      sum + Number(p.paidAmount || 0), 0);

  const totalDue =
    data.reduce((sum,p) =>
      sum + Number(p.dueAmount || 0), 0);

  const doctorSet =
    new Set(data.map(p => p.doctorName).filter(Boolean));

  document.getElementById("totalSale").innerText =
    formatRupees(totalSale);

  document.getElementById("totalReceived").innerText =
    formatRupees(totalReceived);

  document.getElementById("totalDue").innerText =
    formatRupees(totalDue);

  document.getElementById("totalDoctors").innerText =
    doctorSet.size;
}


function renderTable(data) {
  const table = document.getElementById("paymentHistoryTable");
  table.innerHTML = "";

  if (!data || data.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="8" class="text-center">
          No payment history found
        </td>
      </tr>
    `;
    return;
  }

  data.forEach((item, index) => {
   table.innerHTML += `
<tr>
  <td>${index + 1}</td>
  <td>${(item.orderDate || "").split("T")[0]}</td>
  <td>${item.employeeName || "-"}</td>
  <td>${item.doctorName || "-"}</td>

  <td>
    ${formatRupees(item.orderAmount)}
  </td>

  <td class="text-success fw-bold">
    ${formatRupees(item.paidAmount)}
  </td>

  <td class="text-danger fw-bold">
    ${formatRupees(item.dueAmount)}
  </td>

  <td>${item.paymentMode || "-"}</td>

  <td>
    ${
      Number(item.dueAmount || 0) <= 0
      ? '<span class="badge bg-success">Paid</span>'
      : '<span class="badge bg-warning text-dark">Pending</span>'
    }
  </td>
</tr>
`;
  });
}

function resetFilters() {
  document.getElementById("filterMonth").value =
    new Date().toISOString().slice(0, 7);

  document.getElementById("employeeFilter").value = "";
  document.getElementById("doctorFilter").value = "";
  document.getElementById("modeFilter").value = "";

  applyFilters();
}

function formatRupees(amount) {
  return "₹" + Number(amount || 0).toLocaleString("en-IN");
}


function formatDate(dateText) {
  if (!dateText) return "-";

  const date = new Date(dateText);

  if (isNaN(date.getTime())) {
    return dateText;
  }

  return date.toLocaleString("en-IN", {
    day:"2-digit",
    month:"short",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit"
  });
}
</script>

</body>
</html>
