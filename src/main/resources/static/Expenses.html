<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expenses</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
    background:#f4f6fb;
}

.top-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.expense-card,
.history-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
}

.btn-submit{
    background:#0d6efd;
    border:none;
    border-radius:12px;
    padding:12px 30px;
}

.btn-submit:hover{
    background:#0b5ed7;
}

.status-approved{
    color:#198754;
    font-weight:600;
}

.status-pending{
    color:#fd7e14;
    font-weight:600;
}

.status-rejected{
    color:#dc3545;
    font-weight:600;
}
</style>
</head>

<body>

<div class="top-header text-center">
    <h2 class="fw-bold mb-1">Expenses</h2>
    <p class="mb-0">Submit and track your expense claims</p>
</div>

<div class="container py-4">

    <div class="card expense-card">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-4">Submit Expense</h4>

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Expense Type</label>
                    <select class="form-select" id="expenseType">
                        <option>Travel</option>
                        <option>Food</option>
                        <option>Hotel</option>
                        <option>Fuel</option>
                        <option>Medical Sample</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Expense Date</label>
                    <input type="date" id="expenseDate" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Amount</label>
                    <input type="number" id="amount" class="form-control" placeholder="Enter amount">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Bill / Receipt</label>
                    <input type="file" id="billFile" class="form-control" accept="image/*,.pdf">
                </div>

                <div class="col-md-12">
                    <label class="form-label">Remarks</label>
                    <textarea id="remarks" rows="4" class="form-control" placeholder="Enter remarks"></textarea>
                </div>

                <div class="col-md-12">
                    <button class="btn btn-submit text-white" onclick="submitExpense()">
                        <i class="fa-solid fa-paper-plane me-2"></i>
                        Submit Expense
                    </button>
                </div>

            </div>

        </div>
    </div>

    <div class="card history-card mt-4">
        <div class="card-body">

            <h4 class="fw-bold mb-4">Expense History</h4>

            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-primary">
                        <tr>
                            <th>Type</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Remarks</th>
                            <th>Bill</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="expenseHistoryTable">
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>
window.onload = loadExpenseHistory;

function submitExpense() {

    const expenseData = {
        employeeId: localStorage.getItem("employeeId"),
        employeeName: localStorage.getItem("employeeName"),

        expenseType: document.getElementById("expenseType").value,
        expenseDate: document.getElementById("expenseDate").value,
        amount: document.getElementById("amount").value,
        remarks: document.getElementById("remarks").value,
        billUrl: "",
        status: "Pending"
    };

    fetch(`${BASE_URL}/expense/submit`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(expenseData)
    })
    .then(response => response.json())
    .then(data => {
        alert("Expense Submitted Successfully");

        document.getElementById("expenseType").selectedIndex = 0;
        document.getElementById("expenseDate").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("billFile").value = "";
        document.getElementById("remarks").value = "";

        loadExpenseHistory();
    })
    .catch(error => {
        console.error(error);
        alert("Failed to submit expense");
    });
}

function loadExpenseHistory() {

    const employeeId = localStorage.getItem("employeeId");

    fetch(`${BASE_URL}/expense/history/${employeeId}`)
    .then(response => response.json())
    .then(data => {

        const table = document.getElementById("expenseHistoryTable");
        table.innerHTML = "";

        if (data.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center">
                        No Expense Records Found
                    </td>
                </tr>
            `;
            return;
        }

        data.forEach(expense => {

            let statusClass = "status-pending";

            if (expense.status === "Approved") {
                statusClass = "status-approved";
            }

            if (expense.status === "Rejected") {
                statusClass = "status-rejected";
            }

            table.innerHTML += `
                <tr>
                    <td>${expense.expenseType || "-"}</td>
                    <td>${expense.expenseDate || "-"}</td>
                    <td>₹${expense.amount || 0}</td>
                    <td>${expense.remarks || "-"}</td>
                    <td>${expense.billUrl ? `<a href="${expense.billUrl}" target="_blank">View</a>` : "-"}</td>
                    <td>
                        <span class="${statusClass}">
                            ${expense.status || "Pending"}
                        </span>
                    </td>
                </tr>
            `;
        });
    });
}
</script>

</body>
</html>
