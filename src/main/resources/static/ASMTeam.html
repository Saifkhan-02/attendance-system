<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Team</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
body{background:#dfe8f6;font-family:Arial,sans-serif}
.header{
  background:linear-gradient(135deg,#064b90,#1976d2);
  color:white;
  padding:22px 18px;
  border-radius:0 0 28px 28px;
}
.back-btn{
  width:45px;height:45px;border:none;border-radius:12px;
  background:rgba(255,255,255,.2);color:white;
}
.logo{width:130px;background:white;border-radius:10px;padding:5px 12px}
.card-box{
  background:white;border-radius:20px;padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.24);
}
.search-box{
  border-radius:14px;padding:12px;
}
.team-card{
  background:white;border-radius:18px;padding:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.08);
  cursor:pointer;transition:.2s;
}
.team-card:hover{transform:translateY(-3px)}
.avatar{
  width:55px;height:55px;border-radius:50%;
  background:#eef4ff;color:#0d6efd;
  display:flex;align-items:center;justify-content:center;
  font-size:25px;
}
.hq-badge{
  background:#eaf1ff;color:#0d6efd;
  padding:5px 10px;border-radius:8px;
  font-weight:700;font-size:13px;
}
</style>
</head>

<body>

<div class="header">
  <div class="d-flex align-items-center justify-content-between">
    <button class="back-btn" onclick="window.location.href='ASMDashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <img src="images/Inflix-logo-web.png" class="logo">
      <h4 class="fw-bold mt-2 mb-0">My Team</h4>
    </div>

    <!-- Right side Member Count Badge -->
    <div style="min-width: 85px; text-align: right;">
      <span class="badge bg-light text-primary shadow-sm" style="font-size: 13px; padding: 6px 10px; border-radius: 10px;">
        Members: <span id="headerTeamCount">0</span>
      </span>
    </div>
  </div>
</div>

<div class="container py-4">

  <div class="card-box mb-3">
    <div class="row g-2">
      <div class="col-md-8">
        <input type="text" id="searchInput" class="form-control search-box"
               placeholder="Search MR by name or HQ..." onkeyup="filterTeam()">
      </div>

      <div class="col-md-4">
        <select id="hqFilter" class="form-select search-box" onchange="filterTeam()">
          <option value="">All Headquarters</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row g-3" id="teamList"></div>

</div>

<script src="js/config.js"></script>

<script>
const asmId = localStorage.getItem("employeeId");
const role = localStorage.getItem("employeeRole");
const token = localStorage.getItem("sessionToken");

let teamData = [];

if (!asmId || !token || role !== "ASM") {
  localStorage.clear();
  window.location.replace("index.html");
}

window.onload = function(){
  loadTeam();
};

function loadTeam(){
  fetch(`${BASE_URL}/asm/team/${asmId}`)
    .then(res => res.json())
    .then(data => {
      teamData = data || [];
      loadHqFilter(teamData);
      renderTeam(teamData);
    })
    .catch(err => {
      console.error(err);
      alert("Failed to load team");
    });
}

function loadHqFilter(data){
  const filter = document.getElementById("hqFilter");
  const hqs = [...new Set(data.map(e => e.headquarters).filter(Boolean))];

  hqs.forEach(hq => {
    filter.innerHTML += `<option value="${hq}">${hq}</option>`;
  });
}

function renderTeam(data){
  const box = document.getElementById("teamList");
  box.innerHTML = "";

  document.getElementById("headerTeamCount").innerText = data.length;

  if(data.length === 0){
    box.innerHTML = `<div class="text-center text-muted">No MR found</div>`;
    return;
  }

  data.forEach(emp => {
    box.innerHTML += `
      <div class="col-6 col-md-4 col-sm-6">
        <div class="team-card h-100 d-flex flex-column justify-content-between" onclick="openEmployee(${emp.id})">
          <!-- Upper Section(Avatar + details) -->
          <div class="d-flex align-items-center gap-2">
            <div class="avatar" style="min-width: 48px; height: 48px; font-size: 16px; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;">
              <i class="fa-solid fa-user"></i>
            </div>

            <div style="word-break: break-word;">
              <h5 class="fw-bold mb-1" style="font-size: 15px;">${emp.name || "-"}</h5>
              <div class="small text-muted"  style="font-size: 12px;">${emp.mobile || "-"}</div>
              <span class="hq-badge" style="font-size: 10px; padding: 4px 8px; ">${emp.headquarters || "-"}</span>
            </div>
          </div>

          <div class="mt-3 d-flex justify-content-between align-items-end">
            <span class="badge bg-primary" style="font-size: 12px;" >${emp.role || "MR"}</span>
            <span class="badge bg-success" style="font-size: 12px;">${emp.status || "ACTIVE"}</span>
          </div>
        </div>
      </div>
    `;
  });
}

function filterTeam(){
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  const hq = document.getElementById("hqFilter").value;

  const filtered = teamData.filter(emp => {
    const matchText =
      (emp.name || "").toLowerCase().includes(keyword) ||
      (emp.headquarters || "").toLowerCase().includes(keyword);

    const matchHq = !hq || emp.headquarters === hq;

    return matchText && matchHq;
  });

  renderTeam(filtered);
}

function openEmployee(id){
  localStorage.setItem("selectedEmployeeId", id);
  window.location.href = "ASMEmployeeDetails.html";
}
</script>

</body>
</html>
