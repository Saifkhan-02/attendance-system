<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { background:#f4f6fb; }

    .top-header {
      background: linear-gradient(135deg,#0d4f9c,#3f7fe0);
      color:white;
      padding:26px;
      border-radius:0 0 25px 25px;
      box-shadow:0 5px 20px rgba(0,0,0,0.15);
    }

    .top-header .btn-light {
      border-radius:12px;
      font-weight:600;
      padding:8px 16px;
    }

    .filter-card,
    .history-card,
    .total-card {
      border:none;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .form-control {
      border-radius:12px;
      padding:11px;
    }

    th, td {
      white-space: nowrap;
      font-size:14px;
    }

    .status-placed {
      color:#0d6efd;
      font-weight:700;
    }

    .status-completed {
      color:#198754;
      font-weight:700;
    }

    .status-cancelled {
      color:#dc3545;
      font-weight:700;
    }

    .empty-box {
      padding:35px;
      text-align:center;
      color:#6c757d;
    }

    .amount-text {
      font-weight:700;
      color:#198754;
    }
  </style>
</head>

<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between flex-wrap">
    <button class="btn btn-light" onclick="window.location.href='Summary.html'">
      <i class="fa-solid fa-arrow-left me-2"></i>
      
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Order History</h2>
      <p class="mb-0">Track Monthly wise order & sales details</p>
    </div>

    <div style="width:90px"></div>
  </div>
</div>

<div class="container py-4">

  <div class="card filter-card mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">

        <div class="col-md-3">
          <label class="form-label">Select Month</label>
          <input type="month" id="orderMonth" class="form-control">
        </div>

        <div class="col-md-3">
          <label class="form-label">Search Doctor</label>
          <input type="text" id="searchDoctor" class="form-control" placeholder="Doctor name">
        </div>

        <div class="col-md-3">
          <label class="form-label">Search Product</label>
          <input type="text" id="searchProduct" class="form-control" placeholder="Product name">
        </div>

        <div class="col-md-3">
          <button class="btn btn-primary w-100" onclick="applyFilters()">
            <i class="fa-solid fa-filter me-2"></i>
            Filter
          </button>
        </div>

      </div>
    </div>
  </div>

  <div class="row g-3 mb-4">

    <div class="col-md-4">
      <div class="card total-card">
        <div class="card-body text-center">
          <i class="fa-solid fa-cart-shopping fa-2x text-primary mb-2"></i>
          <h6>Total Orders</h6>
          <h3 class="fw-bold" id="totalOrdersCount">0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card total-card">
        <div class="card-body text-center">
          <i class="fa-solid fa-indian-rupee-sign fa-2x text-success mb-2"></i>
          <h6>Total Sales</h6>
          <h3 class="fw-bold text-success" id="totalSalesAmount">₹0</h3>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card total-card">
        <div class="card-body text-center">
          <i class="fa-solid fa-box fa-2x text-warning mb-2"></i>
          <h6>Total Quantity</h6>
          <h3 class="fw-bold" id="totalQuantity">0</h3>
        </div>
      </div>
    </div>

  </div>

  <div class="card history-card">
    <div class="card-body">

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h4 class="fw-bold mb-0">Orders</h4>

        <button class="btn btn-outline-primary btn-sm" onclick="loadOrderHistory()">
          <i class="fa-solid fa-rotate-right me-2"></i>
          Refresh
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-primary">
            <tr>
              <th>Date</th>
              <th>Doctor</th>
              <th>Product</th>
              <th>Quantity</th>
              <th>Selling Price</th>
              <th>Order Amount</th>
              <th>Paid</th>
              <th>Due</th>
              <th>Payment Mode</th>
              <th>Status</th>
              <th>Remarks</th>
            </tr>
          </thead>

          <tbody id="orderHistoryTable">
            <tr>
              <td colspan="11" class="text-center">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>

<script>
let allOrders = [];

window.onload = function () {
  const params = new URLSearchParams(window.location.search);
  const monthFromUrl = params.get("month");

  const currentMonth = new Date().toISOString().slice(0, 7);
  document.getElementById("orderMonth").value = monthFromUrl || currentMonth;

  loadOrderHistory();
};

function loadOrderHistory() {
  const employeeId = localStorage.getItem("employeeId");
  const month = document.getElementById("orderMonth").value;

  fetch(`${BASE_URL}/order/history/monthly/${employeeId}?month=${month}`)
    .then(response => response.json())
    .then(data => {
      allOrders = data || [];
      renderOrderTable(allOrders);
      updateOrderTotals(allOrders);
    })
    .catch(error => {
      console.error(error);
      document.getElementById("orderHistoryTable").innerHTML = `
        <tr>
          <td colspan="11" class="text-center text-danger">
            Failed to load order history
          </td>
        </tr>
      `;
    });
}

function renderOrderTable(data) {
  const table = document.getElementById("orderHistoryTable");
  table.innerHTML = "";

  if (!data || data.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="11">
          <div class="empty-box">
            <i class="fa-solid fa-folder-open fa-2x mb-2"></i>
            <div>No orders found</div>
          </div>
        </td>
      </tr>
    `;
    return;
  }

  data.forEach(order => {
    let statusClass = "status-placed";

    if (order.status === "Completed") statusClass = "status-completed";
    if (order.status === "Cancelled") statusClass = "status-cancelled";

    table.innerHTML += `
      <tr>
        <td>${order.orderDate || "-"}</td>
        <td>${order.doctorName || "-"}</td>
        <td>${order.productName || "-"}</td>
        <td>${order.orderQuantity || 0}</td>
        <td>${formatRupees(order.sellingPrice || 0)}</td>
        <td class="amount-text">${formatRupees(order.orderAmount || 0)}</td>
        <td>${formatRupees(order.paidAmount || 0)}</td>
        <td>${formatRupees(order.dueAmount || 0)}</td>
        <td>${order.paymentMode || "Pending"}</td>
        <td><span class="${statusClass}">${order.status || "Placed"}</span></td>
        <td title="${order.remarks || "-"}">${shortText(order.remarks, 35)}</td>
      </tr>
    `;
  });
}

function applyFilters() {
  const doctor = document.getElementById("searchDoctor").value.toLowerCase().trim();
  const product = document.getElementById("searchProduct").value.toLowerCase().trim();

  const filtered = allOrders.filter(order => {
    const doctorMatch =
      !doctor || (order.doctorName || "").toLowerCase().includes(doctor);

    const productMatch =
      !product || (order.productName || "").toLowerCase().includes(product);

    return doctorMatch && productMatch;
  });

  renderOrderTable(filtered);
  updateOrderTotals(filtered);
}

function updateOrderTotals(data) {
  const totalOrders = data.length;

  const totalSales = data.reduce((sum, order) => {
    return sum + Number(order.orderAmount || 0);
  }, 0);

  const totalQty = data.reduce((sum, order) => {
    return sum + Number(order.orderQuantity || 0);
  }, 0);

  document.getElementById("totalOrdersCount").innerText = totalOrders;
  document.getElementById("totalSalesAmount").innerText = formatRupees(totalSales);
  document.getElementById("totalQuantity").innerText = totalQty;
}

function formatRupees(amount) {
  return "₹" + Number(amount).toLocaleString("en-IN");
}

function shortText(text, limit) {
  if (!text) return "-";
  return text.length > limit ? text.substring(0, limit) + "..." : text;
}
</script>

</body>
</html>
