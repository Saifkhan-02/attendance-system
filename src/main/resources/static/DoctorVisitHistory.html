<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Visit History</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      background: #f4f6fb;
    }

    .top-header {
      background: linear-gradient(135deg, #0d4f9c, #3f7fe0);
      color: white;
      padding: 26px;
      border-radius: 0 0 25px 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    .top-header .btn-light {
      border-radius: 12px;
      font-weight: 600;
      padding: 0;
    }

    .filter-card,
    .history-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      padding: 11px;
    }

    .visit-img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      border: 2px solid #e9ecef;
    }

    .status-completed {
      color: #198754;
      font-weight: 700;
    }

    .status-pending {
      color: #fd7e14;
      font-weight: 700;
    }

    .status-rejected {
      color: #dc3545;
      font-weight: 700;
    }

    th {
      white-space: nowrap;
    }

    td {
      white-space: nowrap;
      font-size: 14px;
    }

    .empty-box {
      padding: 35px;
      text-align: center;
      color: #6c757d;
    }

    @media(max-width:768px) {
      .top-header {
        text-align: center;
      }

      .top-header .d-flex {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="top-header">
    <div class="d-flex align-items-center justify-content-between flex-wrap">
      <button class="btn btn-light" onclick="window.location.href='Summary.html'">
        <i class="fa-solid fa-arrow-left me-2"></i>
        
      </button>

      <div class="text-center flex-grow-1">
        <h2 class="fw-bold mb-1">Doctor Visit History</h2>
        <p class="mb-0">Complete doctor visit records with images and location</p>
      </div>

      <div style="width:90px"></div>
    </div>
  </div>

  <div class="container py-4">

    <div class="card filter-card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">


          <div class="col-md-3">
            <label class="form-label">From Date</label>
            <input type="date" id="fromDate" class="form-control">
          </div>

          <div class="col-md-3">
            <label class="form-label">To Date</label>
            <input type="date" id="toDate" class="form-control">
          </div>

          <div class="col-md-3">
            <label class="form-label">Search Doctor</label>
            <input type="text" id="searchDoctor" class="form-control" placeholder="Doctor name">
          </div>

          <div class="col-md-3">
            <button class="btn btn-primary w-100" onclick="applyFilters()">
              <i class="fa-solid fa-filter me-2"></i>
              Filter
            </button>
          </div>

        </div>
      </div>
    </div>

    <div class="card history-card">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h4 class="fw-bold mb-0">All Visits</h4>

          <button class="btn btn-outline-primary btn-sm" onclick="loadDoctorVisitHistory()">
            <i class="fa-solid fa-rotate-right me-2"></i>
            Refresh
          </button>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-primary">
              <tr>
                <th>Working With</th>
                <th>Person Name</th>
                <th>Dr./Chemist</th>
                <th>Specialization</th>
                <th>DOB</th>
                <th>DOA</th>
                <th>Hospital/Clinic</th>
                <th>Date</th>
                <th>Time</th>
                <th>Location</th>
                <th>Landmark</th>
                <th>Accuracy</th>
                <th>Image</th>
                <th>Remarks</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="doctorVisitHistoryTable">
              <tr>
                <td colspan="15" class="text-center">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>

  </div>

  <div class="modal fade" id="visitImageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4">

        <div class="modal-header">
          <h5 class="modal-title">Visit Image</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body text-center">
          <img id="visitFullImage"
               src=""
               style="max-width:100%;max-height:75vh;border-radius:14px;object-fit:contain;">
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>

  <script>
    let allDoctorVisits = [];

    window.onload = function () {
      loadDoctorVisitHistory();
    };

    function loadDoctorVisitHistory() {
      const employeeId = localStorage.getItem("employeeId");

      fetch(`${BASE_URL}/doctor-visit/history/${employeeId}`)
        .then(response => response.json())
        .then(data => {
          allDoctorVisits = data || [];
          renderDoctorVisitTable(allDoctorVisits);
        })
        .catch(error => {
          console.error(error);
          document.getElementById("doctorVisitHistoryTable").innerHTML = `
            <tr>
              <td colspan="15" class="text-center text-danger">
                Failed to load doctor visit history
              </td>
            </tr>
          `;
        });
    }

    function renderDoctorVisitTable(data) {
      const table = document.getElementById("doctorVisitHistoryTable");
      table.innerHTML = "";

      if (!data || data.length === 0) {
        table.innerHTML = `
          <tr>
            <td colspan="15">
              <div class="empty-box">
                <i class="fa-solid fa-folder-open fa-2x mb-2"></i>
                <div>No doctor visits found</div>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      data.forEach(visit => {
        let statusClass = "status-completed";

        if (visit.status === "Rejected") {
          statusClass = "status-rejected";
        }

        if (visit.status === "Pending") {
          statusClass = "status-pending";
        }

        table.innerHTML += `
          <tr>
            <td>${visit.workingWith || "-"}</td>
            <td>${visit.workingPersonName || "-"}</td>
            <td>${visit.doctorName || "-"}</td>
            <td>${visit.specialization || "-"}</td>
            <td>${visit.dob || "-"}</td>
            <td>${visit.anniversaryDate || "-"}</td>
            <td>${visit.hospitalName || "-"}</td>
            <td>${visit.visitDate || "-"}</td>
            <td>${visit.visitTime || "-"}</td>
            <td title="${visit.location || "-"}">${shortText(visit.location, 35)}</td>
            <td>${visit.landmark || "-"}</td>
            <td>${visit.accuracy ? visit.accuracy + " m" : "-"}</td>
            <td>
              ${
                visit.photo
                  ? `<img src="${visit.photo}"
                          class="visit-img"
                          onclick="openVisitImage('${visit.photo}')">`
                  : "-"
              }
            </td>
            <td title="${visit.remarks || "-"}">${shortText(visit.remarks, 35)}</td>
            <td>
              <span class="${statusClass}">
                ${visit.status || "Completed"}
              </span>
            </td>
          </tr>
        `;
      });
    }

    function applyFilters() {
      const searchDoctor = document.getElementById("searchDoctor").value.toLowerCase().trim();
      const fromDate = document.getElementById("fromDate").value;
      const toDate = document.getElementById("toDate").value;

      let filtered = allDoctorVisits.filter(visit => {
        const doctorMatch =
          !searchDoctor ||
          (visit.doctorName || "").toLowerCase().includes(searchDoctor);

        const visitDate = visit.visitDate || "";

        const fromMatch = !fromDate || visitDate >= fromDate;
        const toMatch = !toDate || visitDate <= toDate;

        return doctorMatch && fromMatch && toMatch;
      });

      renderDoctorVisitTable(filtered);
    }

    function openVisitImage(imageUrl) {
      document.getElementById("visitFullImage").src = imageUrl;

      const modal = new bootstrap.Modal(
        document.getElementById("visitImageModal")
      );

      modal.show();
    }

    function shortText(text, limit) {
      if (!text) return "-";
      return text.length > limit ? text.substring(0, limit) + "..." : text;
    }
  </script>

</body>
</html>
