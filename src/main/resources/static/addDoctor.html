<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .form-card{
            border:none;
            border-radius:15px;
            box-shadow:0 3px 15px rgba(0,0,0,0.1);
        }

        .page-header{
            background:linear-gradient(135deg,#0d6efd,#4f8dfd);
            color:white;
            border-radius:15px;
            padding:20px;
            margin-bottom:20px;
        }

    </style>

</head>


<body>

<div class="container mt-4">

    <!-- Header -->

    <div class="page-header">

        <h2>
            <i class="fas fa-user-doctor"></i>
            Add New Doctor
        </h2>

        <p class="mb-0">
            Create and manage doctor profiles
        </p>

    </div>

    <!-- Form -->

    <div class="card form-card">

        <div class="card-body p-4">

            <form action="/admin/save-doctor" method="post">

                <div class="row">

                    <!-- Doctor Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Doctor Name
                        </label>

                        <input type="text"
                               name="doctorName"
                               class="form-control"
                               required>

                    </div>

                    <!-- Specialization -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Specialization
                        </label>

                        <input type="text"
                               name="specialization"
                               class="form-control"
                               required>

                    </div>

                    <!-- Clinic Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Clinic Name
                        </label>

                        <input type="text"
                               name="clinicName"
                               class="form-control">

                    </div>

                    <!-- City -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input type="text"
                               name="city"
                               class="form-control">

                    </div>

                    <!-- Employee -->

                   <div class="col-md-6 mb-3">

    <label class="form-label">
        Assign Employee
    </label>

    <select id="employeeSelect"
            class="form-select"
            required>

        <option value="">
            Select Employee
        </option>

    </select>

    <input type="hidden"
           id="employeeId"
           name="employeeId">

    <input type="hidden"
           id="employeeName"
           name="employeeName">

</div>

                    <!-- Phone -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control">

                    </div>

                    <!-- Address -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <input type="text"
                               name="address"
                               class="form-control">

                    </div>

                    <!-- Status -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select name="status"
                                class="form-select">

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>

                <hr>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="fas fa-save"></i>
                        Save Doctor

                    </button>

                   <a href="/doctorList.html" class="btn btn-secondary"> Back </a>   
                   
                 </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>

<script>

window.onload = loadEmployees;

function loadEmployees() {

    fetch(`${BASE_URL}/get-employees`)
    .then(response => response.json())
    .then(data => {

        const select =
            document.getElementById("employeeSelect");

        select.innerHTML = `
            <option value="">
                Select Employee
            </option>
        `;

        data.forEach(emp => {

            select.innerHTML += `
                <option value="${emp.id}"
                        data-name="${emp.name}">
                    ${emp.name} - ${emp.username || ""} 
                </option>
            `;
        });
    })
    .catch(error => {
        console.error(error);
        alert("Failed to load employees");
    });
}

document.getElementById("employeeSelect")
.addEventListener("change", function(){

    const selectedOption =
        this.options[this.selectedIndex];

    document.getElementById("employeeId").value =
        this.value;

    document.getElementById("employeeName").value =
        selectedOption.getAttribute("data-name");
});

document.querySelector("form")
.addEventListener("submit", function(e){

    e.preventDefault();

    let formData = new FormData(this);

    fetch(`${BASE_URL}/admin/save-doctor`, {
        method: "POST",
        body: formData
    })
    .then(response => response.json())
    .then(data => {

        alert("Doctor Added Successfully!");

        window.location.href = "doctorList.html";
    })
    .catch(error => {

        console.error(error);

        alert("Error while saving doctor!");
    });
});

</script>

</body>
</html>
