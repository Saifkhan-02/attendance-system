      .navbar-in h1 {
        font-size: 30px;
        font-weight: bold;
        margin: 0;
        border: none;
        box-shadow: 0px 0px 17px black;
        border-radius: 16px;
        padding: 3px 9px;
      }
      .navbar-in h1:hover {
        text-shadow: 2px 0px 20px blue;
      }
      .login-card {
        width: 100%;
        min-height: 500px;
        font-family: "Roboto", sans-serif;
        border: none;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 32px;
        box-shadow: 0px 0px 50px rgba(0, 0, 0, 0.5);
        padding: 40px 30px;
      }
      .inputbox {
        position: relative;
        width: 100%;
        max-width: 350px;
        display: flex;
        align-items: center;
      }
      .inputbox input {
        width: 100%;
        height: 48px;
        padding: 10px 40px 10px 10px;
        border: 3px solid rgba(255, 255, 255, 0.7);
        border-radius: 6px;
        background: #3a7bd5;
        outline: none;
        font-size: 18px;
        color: #fff;
        transition: 0.5s;
      }
      .inputbox span {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem;
        color: rgb(255, 255, 255, 0.7);
        text-transform: uppercase;
        transition: 0.3s;
        pointer-events: none;
        background: transparent;
      }
      .inputbox input:valid ~ span,
      .inputbox input:focus ~ span {
        top: 0;
        color: #0f0f0f;
        transform: translateY(-50%) scale(0.85);
        font-size: 0.75rem;
        padding: 0 8px;
        background: #3a7bd5;
        border-left: 2px solid #75e44f;
        border-right: 2px solid #75e44f;
        font-weight: bold;
        letter-spacing: 0.1rem;
      }
      .inputbox input:valid,
      .inputbox input:focus {
        border-color: black;
        box-shadow: 0 0 11px black;
      }
      .btn2 {
        color: rgb(11, 12, 12);
        font-size: 18px;
        text-decoration: none;
        cursor: pointer;
      }
      .btn2:hover {
        color: #32078e;
        text-decoration: underline;
      }
      .inputbox,
.button {
  width: 100%;
  max-width: 350px;
}
      .button {
        position: relative;
        height: 45px;
        background: transparent;
        border-radius: 41px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        border: 2px solid dodgerblue;
        overflow: hidden;
        z-index: 1;
        color: #fff;

        display: block;
        margin: 0 auto;
      }
      .button::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 400%;
        background: linear-gradient(#25252b, dodgerblue, #25252b, #ff2770);
        top: -100%;
        left: 0;
        z-index: -1;
        transition: 0.5s;
      }

      .button:hover::before {
        top: 0;
      }
      .inputbox i {
        position: absolute;
        top: 50%;
        right: 12px;
        font-size: 18px;
        transform: translateY(-50%);
        pointer-events: none;
      }
      .inputbox input:focus ~ i,
      .inputbox input:valid ~ i {
        color: black;
      }
      @media (max-width: 768px) {
        .login-card {

      @media (max-width: 480px) {

          max-width: 100%;
        }

        .navbar-in h1 {
          font-size: 22px;
        }

        .button {
          height: 42px;
          font-size: 16px;
        }

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
<script src="js/config.js"></script>

    <script>

    function login() {

    let role = document.getElementById("role").value;

      if(role === "employee") {

          loginEmployee();

      } else {

          loginAdmin();

      }
    }

      function loginEmployee() {
       
       
        fetch(`${BASE_URL}/login`, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            username: document.getElementById("username").value,

            password: document.getElementById("password").value,
          }),
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error("Invalid Username or Password");
            }

            return response.json();
          })

          .then((data) => {
            localStorage.setItem("employeeId", data.id);
            localStorage.setItem("employeeName", data.name);
            localStorage.setItem("employeeUsername", data.username);

             console.log("Saved Employee ID:",
        localStorage.getItem("employeeId"));

            window.location.href = "Dashboard.html";
          })

          .catch((error) => {
            alert(error.message);
          });
      }

    function loginAdmin(){

    fetch(`${BASE_URL}/admin/login`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            username:
            document.getElementById("username").value,

            password:
            document.getElementById("password").value

        })

    })

    .then(response=>{

        if(!response.ok){

            throw new Error(
                "Invalid Admin Credentials"
            );
        }

        return response.json();

    })

    .then(data=>{

        localStorage.setItem(
            "adminId",
            data.id
        );

        localStorage.setItem(
            "adminName",
            data.name
        );

        window.location.href =
            "admin-dashboard.html";

    })

    .catch(error=>{

        alert(error.message);

    });

}
    </script>
