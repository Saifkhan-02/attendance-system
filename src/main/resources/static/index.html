            .container{

            .inputbox{
                position: relative;
                width: 350px;
            }
            .inputbox input{
                width: 100%;
                padding: 10px;
                border: 3px solid rgba(255,255,255,0.7);
                border-radius: 6px;
                background: #3A7BD5;
                outline: none;
                font-size: 18px;
                color: #fff;
                transition: 0.5s;
            }
            .inputbox span{
                position: absolute;
                left: 0;
                padding: 10px;
                pointer-events: none;
                font-size: 1.2rem;
                color: rgb(255, 255, 255, 0.7);
                text-transform: uppercase;
                transition: 0.5s;
            }
            .inputbox input:valid ~ span,
            .inputbox input:focus ~ span {
                color: #0f0f0f;
                transform: translateX(10px) translateY(-7px);
                font-size: 0.77rem;
                padding: 0 10px;
                background: #3A7BD5;
                border-left: 2px solid #75e44f;
                border-right: 2px solid #75e44f;
                font-weight: bold;
                letter-spacing: 0.2rem;
            }
            .inputbox input:valid,
            .inputbox input:focus{
                border-color: black;
                box-shadow: 0 0 11px black;
            }
            .btn2{
                color: rgb(11, 12, 12);
                font-size: 18px; 
                text-decoration: none;
            }
            .btn2:hover{
                color: #32078e;

            }
            .button {
                position: relative;
                width: 100%;
                height: 45px;
                background: transparent;
                border-radius: 41px;
                cursor: pointer;
                font-size: 20px;
                font-weight: 600;
                border: 2px solid dodgerblue;
                overflow: hidden;
                z-index: 1;
                color: #fff;
            }
            .button::before {
                content: '';
                position: absolute;
                width: 100%;
                height: 400%;
                background: linear-gradient(#25252b, dodgerblue, #25252b, #ff2770);
                top: -100%;
                left: 0;
                z-index: -1;
                transition: .5s;
            }

            .button:hover::before {
                top: 0;
            }
            .inputbox i {
                position: absolute;
                top: 50%;
                right: 0;
                font-size: 21px;
                transform: translateY(-50%);
            }
            .inputbox input:focus~i,
            .inputbox input:valid~i {
                color: black;
            }

        <form id="loginConf">
            <div class="container">
                <div class="inputbox">
                    <input type="text" id="username" name="user" required>
                    <span>Username/Employee ID</span>
                     <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <div class="inputbox">
                        <input type="password"  id="password"  name="pswd" required> 
                        <span>Password</span>
                         <i class="fa-solid fa-lock"></i>
                    </div>

                </div>
                <div class="lower-cont">

                    <div>
                        <button type="button" class="button" onclick="loginEmployee()">Login</button>
                    </div>
                    <p style='padding-top:82px;'>Don't have an account?/<a href="/register.html" class="btn2">Contact your administrator</a></p>

                </div>            
        </form>
        <script>

function loginEmployee(){

    fetch("http://10.222.210.216/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            username:document.getElementById("username").value,

            password:document.getElementById("password").value

        })

    })

    .then(response => {

        if(!response.ok){
            throw new Error("Invalid Username or Password");
        }

        return response.json();

    })

    .then(data => {

        localStorage.setItem("employeeId", data.id);
        localStorage.setItem("employeeName", data.name);
        localStorage.setItem("employeeUsername", data.username);

        window.location.href = "Dashboard.html";

    })

    .catch(error => {

        alert(error.message);

    });

}

</script>
