<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Available Stock</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">

<style>
body{
    background:#f4f6fb;
}

.top-header{
    background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
    color:white;
    padding:25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}
.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.back-btn:hover{
  background:rgba(255,255,255,.3);
}

.summary-card,
.stock-card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.form-control,
.form-select{
    border-radius:12px;
    padding:12px;
}

.status-instock{
    color:#198754;
    font-weight:600;
}

.status-low{
    color:#fd7e14;
    font-weight:600;
}

.status-out{
    color:#dc3545;
    font-weight:600;
}

.stock-box{
    background:#e9f2ff;
    color:#0d4f9c;
    border-radius:15px;
    padding:18px;
    font-weight:700;
    font-size:20px;
}
.choices__list--dropdown {
    max-height: 220px;
    overflow-y: auto;
    z-index: 9999;
}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">

    <button class="back-btn"
            onclick="window.location.href='Dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Available Stock</h2>
      <p class="mb-0">View Stock Distributor wise</p>
    </div>

    <div style="width:42px"></div>

  </div>
</div>

<div class="container py-4">

    <div class="row g-4 mb-4">

        <div class="col-md-4 col-6">
            <div class="card summary-card">
                <div class="card-body text-center">
                    <i class="fa-solid fa-boxes-stacked fa-2x text-primary mb-2"></i>
                    <h6>Total Products</h6>
                    <h3 class="fw-bold" id="totalProducts">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4 col-6">
            <div class="card summary-card">
                <div class="card-body text-center">
                    <i class="fa-solid fa-cubes fa-2x text-success mb-2"></i>
                    <h6>Total Units</h6>
                    <h3 class="fw-bold" id="totalUnits">0</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4 col-12">
            <div class="card summary-card">
                <div class="card-body text-center">
                    <i class="fa-solid fa-triangle-exclamation fa-2x text-warning mb-2"></i>
                    <h6>Low Stock Products</h6>
                    <h3 class="fw-bold" id="lowStockCount">0</h3>
                </div>
            </div>
        </div>

    </div>

    <div class="card stock-card">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-4">Check Distributor Stock</h4>

            <div class="row g-3">
                <div class="col-md-6">
    <label class="form-label">Select Distributor</label>
    <select id="distributorId" class="form-select" onchange="loadDistributorStock()">
        <option value="">Select Distributor</option>
    </select>
</div>

                <div class="col-md-6">
                    <label class="form-label">Select Product</label>
                    <select id="productId" class="form-select" onchange="showProductStock()">
                        <option value="">Select Product</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Available Units</label>
                    <div class="stock-box" id="selectedAvailableUnits">0</div>
                </div>

                <!-- <div class="col-md-3">
                    <label class="form-label">Selling Price</label>
                    <div class="stock-box" id="selectedSellingPrice">₹0</div>
                </div> -->

            </div>

        </div>
    </div>

    <div class="card stock-card mt-4">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="fw-bold mb-0">Product Stock List</h4>

                <button class="btn btn-outline-primary" onclick="loadDistributorStock()">
                    <i class="fa-solid fa-rotate-right me-2"></i>
                    Refresh
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>Product</th>
                            <th>Available Units</th>
                            <!-- <th>Selling Price</th> -->
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="stockTable"></tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script src="js/config.js"></script>
<script src="js/session-check.js"></script>

<script>
let distributorStockList = [];
let employeeHeadquarters = "";
let productChoices = null;

window.onload = function () {
    loadEmployeeAndDistributors();
};

function loadEmployeeAndDistributors() {
    const employeeId = localStorage.getItem("employeeId");

    fetch(`${BASE_URL}/employee/${employeeId}`)
        .then(response => response.json())
        .then(employee => {
            employeeHeadquarters =
                employee.headquarters || employee.headQuarters || employee.headQuarter || "";

            if (!employeeHeadquarters) {
                alert("Employee headquarter not found");
                return;
            }

            loadDistributors(employeeHeadquarters);
        })
        .catch(error => {
            console.error(error);
            alert("Failed to load employee details");
        });
}

function loadDistributors(headquarters) {
    fetch(`${BASE_URL}/distributor/by-headquarter/${encodeURIComponent(headquarters)}`)
        .then(response => response.json())
        .then(data => {
            const dropdown = document.getElementById("distributorId");

            dropdown.innerHTML = `<option value="">Select Distributor</option>`;

            if (!data || data.length === 0) {
                alert("No distributors found for " + headquarters);
                updateSummary(0, 0, 0);
                document.getElementById("stockTable").innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center">
                            No Distributors Found
                        </td>
                    </tr>
                `;
                return;
            }

            data.forEach(distributor => {
                dropdown.innerHTML += `
                    <option value="${distributor.id}">
                        ${distributor.distributorName}
                    </option>
                `;
            });
        })
        .catch(error => {
            console.error(error);
            alert("Failed to load distributors");
        });
}

function loadDistributorStock() {
    const distributorId = document.getElementById("distributorId").value;

    if (!distributorId) {
        distributorStockList = [];
        updateSummary(0, 0, 0);
        document.getElementById("productId").innerHTML =
            `<option value="" disabled selected>Select Product</option>`;
        document.getElementById("stockTable").innerHTML = `
            <tr>
                <td colspan="4" class="text-center">
                    Please select distributor
                </td>
            </tr>
        `;
        clearSelectedProductBox();
        return;
    }

    fetch(`${BASE_URL}/distributor-stock/${distributorId}`)
        .then(response => response.json())
        .then(data => {
            distributorStockList = data || [];

            const dropdown = document.getElementById("productId");
            const table = document.getElementById("stockTable");

            dropdown.innerHTML = "";
            table.innerHTML = "";

            let totalProducts = distributorStockList.length;
            let totalUnits = 0;
            let lowStockCount = 0;

            if (distributorStockList.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center">
                            No Stock Found For This Distributor
                        </td>
                    </tr>
                `;

                updateSummary(0, 0, 0);
                clearSelectedProductBox();
                return;
            }

            distributorStockList.forEach(product => {
                const availableUnits = Number(product.availableUnits || 0);
               

                totalUnits += availableUnits;

                let statusText = "In Stock";
                let statusClass = "status-instock";

                if (availableUnits <= 0) {
                    statusText = "Out of Stock";
                    statusClass = "status-out";
                } else if (availableUnits <= 20) {
                    statusText = "Low Stock";
                    statusClass = "status-low";
                    lowStockCount++;
                }

                dropdown.innerHTML += `
                    <option value="${product.id}">
                        ${product.productName}
                    </option>
                `;

                table.innerHTML += `
                    <tr>
                        <td>${product.productName || "-"}</td>
                        <td>${availableUnits}</td>
                       
                        <td>
                            <span class="${statusClass}">
                                ${statusText}
                            </span>
                        </td>
                    </tr>
                `;
            });
            if (productChoices) {
    productChoices.destroy();
}

productChoices = new Choices("#productId", {
    searchEnabled: true,
    itemSelectText: "",
    shouldSort: false,
     placeholder: true,
    placeholderValue: "Select Product",
    searchPlaceholderValue: "Search product..."
   
});

            updateSummary(totalProducts, totalUnits, lowStockCount);
            clearSelectedProductBox();
        })
        .catch(error => {
            console.error(error);
            alert("Failed to load distributor stock");
        });
}

function showProductStock() {
    const stockId = document.getElementById("productId").value;

    const product = distributorStockList.find(
        item => String(item.id) === String(stockId)
    );

    if (!product) {
        clearSelectedProductBox();
        return;
    }

    document.getElementById("selectedAvailableUnits").innerText =
        product.availableUnits || 0;

   
}

function clearSelectedProductBox() {
    document.getElementById("selectedAvailableUnits").innerText = "0";
   
}

function updateSummary(totalProducts, totalUnits, lowStockCount) {
    document.getElementById("totalProducts").innerText = totalProducts;
    document.getElementById("totalUnits").innerText = totalUnits;
    document.getElementById("lowStockCount").innerText = lowStockCount;
}
</script>

</body>
</html>
