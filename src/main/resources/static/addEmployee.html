<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Employee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
  background:#f4f6fb;
}

.top-header{
  background:linear-gradient(135deg,#0d4f9c,#3f7fe0);
  color:white;
  padding:24px;
  border-radius:0 0 25px 25px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.employee-card{
  border:none;
  border-radius:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.section-title{
  font-weight:800;
  margin-bottom:15px;
  color:#0d4f9c;
}

.form-control,
.form-select{
  border-radius:12px;
  padding:12px;
}

.input-wrap{
  position:relative;
}

.toggle-eye{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  color:#6c757d;
}

.avatar-box{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#e9f2ff;
  color:#0d6efd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  margin:auto;
  border:2px dashed #0d6efd;
}

.btn-save{
  background:#0d6efd;
  border:none;
  border-radius:12px;
  padding:12px 35px;
  font-weight:700;
}

.btn-save:hover{
  background:#0b5ed7;
}

.rule-box{
  background:#f8fbff;
  border:1px solid #dbeafe;
  border-radius:14px;
  padding:12px;
  font-size:13px;
}

.rule-box i{
  color:#198754;
}
</style>
</head>

<body>

<div class="top-header">
  <div class="d-flex align-items-center justify-content-between">
    <button class="back-btn" onclick="window.location.href='admin-dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Add Employee</h2>
      <p class="mb-0">Create employee profile and login credentials</p>
    </div>

    <div style="width:42px"></div>
  </div>
</div>

<div class="container py-4">

  <div class="card employee-card">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <div class="avatar-box mb-2">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h4 class="fw-bold mb-1">New Employee Registration</h4>
        <p class="text-muted mb-0">Fill all required employee details</p>
      </div>

      <form id="employeeForm">

        <h5 class="section-title">
          <i class="fa-solid fa-id-card me-2"></i>
          Personal Information
        </h5>

        <div class="row g-3 mb-4">

          <div class="col-md-6">
            <label class="form-label fw-bold">Employee Name *</label>
            <input type="text" id="name" class="form-control" placeholder="Enter employee name">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Mobile Number *</label>
            <input type="text" id="mobile" class="form-control" maxlength="10" placeholder="Enter mobile number">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email address">
          </div>

          <!-- <div class="col-md-6">
            <label class="form-label fw-bold">Profile Photo URL</label>
            <input type="text" id="profileImage" class="form-control" placeholder="Optional image URL">
          </div> -->

        </div>

        <h5 class="section-title">
          <i class="fa-solid fa-briefcase me-2"></i>
          Company Information
        </h5>

        <div class="row g-3 mb-4">

          <div class="col-md-6">
            <label class="form-label fw-bold">Designation *</label>
            <select id="designation" class="form-select">
              <option value="">Select Designation</option>
              <option value="Medical Representative">Medical Representative</option>
              <option value="Area Sales Manager">Area Sales Manager</option>
              <option value="Regional Manager">Regional Manager</option>
              <option value="Zonal Manager">Zonal Manager</option>
              <option value="Admin">Admin</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Headquarter *</label>
            <select id="headquarters" class="form-select">
              <option value="">Select Headquarter</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Reporting Manager</label>
            <input type="text" id="reportingManager" class="form-control" placeholder="Enter reporting manager">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Joining Date *</label>
            <input type="date" id="joiningDate" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-bold">Status *</label>
            <select id="status" class="form-select">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>

        </div>

        <h5 class="section-title">
          <i class="fa-solid fa-lock me-2"></i>
          Login Information
        </h5>

        <div class="row g-3 mb-3">

          <div class="col-md-4">
            <label class="form-label fw-bold">Username *</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username">
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Password *</label>
            <div class="input-wrap">
              <input type="password" id="password" class="form-control" placeholder="Enter password">
              <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('password', this)"></i>
            </div>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-bold">Confirm Password *</label>
            <div class="input-wrap">
              <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password">
              <i class="fa-solid fa-eye toggle-eye" onclick="togglePassword('confirmPassword', this)"></i>
            </div>
          </div>

        </div>

        <div class="rule-box mb-4">
          <div><i class="fa-solid fa-circle-check me-2"></i>Password minimum 6 characters</div>
          <div><i class="fa-solid fa-circle-check me-2"></i>At least 1 number</div>
          <div><i class="fa-solid fa-circle-check me-2"></i>At least 1 special character</div>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="button" class="btn btn-save text-white" onclick="saveEmployee()">
            <i class="fa-solid fa-floppy-disk me-2"></i>
            Save Employee
          </button>

          <a href="employeeList.html" class="btn btn-secondary px-4">
            <i class="fa-solid fa-list me-2"></i>
            Employee List
          </a>
        </div>

      </form>

    </div>
  </div>

</div>

<script src="js/config.js"></script>

<script>
window.onload = function () {
  loadHeadquarters();
};

function loadHeadquarters() {
  fetch(`${BASE_URL}/headquarter/active`)
    .then(response => response.json())
    .then(data => {
      const dropdown = document.getElementById("headquarters");
      dropdown.innerHTML = `<option value="">Select Headquarter</option>`;

      data.forEach(hq => {
        dropdown.innerHTML += `
          <option value="${hq.headquarterName}">
            ${hq.headquarterName}
          </option>
        `;
      });
    })
    .catch(error => {
      console.error(error);
      alert("Failed to load headquarters");
    });
}

function togglePassword(inputId, icon) {
  const input = document.getElementById(inputId);

  if (input.type === "password") {
    input.type = "text";
    icon.classList.remove("fa-eye");
    icon.classList.add("fa-eye-slash");
  } else {
    input.type = "password";
    icon.classList.remove("fa-eye-slash");
    icon.classList.add("fa-eye");
  }
}

function saveEmployee() {
  const name = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const email = document.getElementById("email").value.trim();
  //const profileImage = document.getElementById("profileImage").value.trim();
  const designation = document.getElementById("designation").value;
  const headquarters = document.getElementById("headquarters").value;
  const reportingManager = document.getElementById("reportingManager").value.trim();
  const joiningDate = document.getElementById("joiningDate").value;
  const status = document.getElementById("status").value;
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();

  if (!name) {
    alert("Employee name is required");
    return;
  }

  if (!/^[0-9]{10}$/.test(mobile)) {
    alert("Enter valid 10 digit mobile number");
    return;
  }

  if (!email) {
    alert("Email is required");
    return;
  }

  if (!designation) {
    alert("Please select designation");
    return;
  }

  if (!headquarters) {
    alert("Please select headquarter");
    return;
  }

  if (!joiningDate) {
    alert("Please select joining date");
    return;
  }

  if (!username) {
    alert("Username is required");
    return;
  }
  
if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{5,}$/.test(username)) {
    alert("Username must be at least 5 characters and contain letters and numbers");
    return;
}

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  if (!/\d/.test(password)) {
    alert("Password must contain at least 1 number");
    return;
  }

  if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
    alert("Password must contain at least 1 special character");
    return;
  }

  if (password !== confirmPassword) {
    alert("Password and confirm password do not match");
    return;
  }

  const employee = {
    name,
    email,
    username,
    password,
    mobile,
    designation,
    headquarters,
    reportingManager,
    joiningDate,
    status
  };

  fetch(`${BASE_URL}/register`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(employee)
  })
  .then(response => response.text())
  .then(data => {
    alert(data);
    window.location.href = "employeeList.html";
  })
  .catch(error => {
    console.error(error);
    alert("Failed to save employee");
  });
}
</script>

</body>
</html>
