<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Leave Requests</title>

  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6fb;
}


 .top-header {
        background: linear-gradient(135deg, #0d4f9c, #3f7fe0);
        color: white;
        padding: 15px;
        border-radius: 0 0 25px 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }

      .back-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
}

.back-btn:hover{
  background:rgba(255,255,255,.3);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.badge-pending{
    background:#fd7e14;
}

.badge-approved{
    background:#198754;
}

.badge-rejected{
    background:#dc3545;
}
</style>
</head>

<body>

<div class="top-header text-center">
    <div class="d-flex align-items-center justify-content-between">

    <button class="back-btn"
            onclick="window.location.href='admin-dashboard.html'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="text-center flex-grow-1">
      <h2 class="fw-bold mb-1">Leave Requests</h2>
      <p class="mb-0">Approve and Reject Leave Requests</p>
    </div>

    <div style="width:42px"></div>

  </div>
</div>

<div class="container py-4">

    <div class="card">
        <div class="card-body">

            <h4 class="fw-bold mb-4">All Leave Requests</h4>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-primary">
                        <tr>
                           <th>Employee ID</th>
                            <th>Employee Name</th>
                            <th>Employee Contact</th>
                            <th>Leave Type</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="leaveRequestTable"></tbody>

                </table>

                

            </div>

        </div>
    </div>

</div>

<script src="js/config.js"></script>

<script>

window.onload = loadAllLeaves;

function loadAllLeaves() {

    fetch(`${BASE_URL}/admin/leaves`)

    .then(response => response.json())

    .then(data => {

        const table = document.getElementById("leaveRequestTable");

        table.innerHTML = "";

        if(data.length === 0) {
            table.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center">
                        No Leave Requests Found
                    </td>
                </tr>
            `;
            return;
        }

        data.forEach(leave => {

            let badgeClass = "badge-pending";

            if(leave.status === "Approved") {
                badgeClass = "badge-approved";
            }

            if(leave.status === "Rejected") {
                badgeClass = "badge-rejected";
            }

            let actionButtons = "-";

            if(leave.status === "Pending") {
                actionButtons = `
                    <button class="btn btn-success btn-sm me-1"
                            onclick="approveLeave(${leave.id})">
                        Approve
                    </button>

                    <button class="btn btn-danger btn-sm"
                            onclick="rejectLeave(${leave.id})">
                        Reject
                    </button>
                `;
            }

            table.innerHTML += `
                <tr>
                    <td>${leave.employeeId || "-"}</td>
                    <td>${leave.employeeName || "-"}</td>
                    <td>${leave.emergencyContact || "-"}</td>
                    <td>${leave.leaveType || "-"}</td>
                    <td>${leave.fromDate || "-"}</td>
                    <td>${leave.toDate || "-"}</td>
                    <td>${leave.reason || "-"}</td>
                    <td>
                        <span class="badge ${badgeClass}">
                            ${leave.status}
                        </span>
                    </td>
                    <td>${actionButtons}</td>
                </tr>
            `;
        });
    });
}

function approveLeave(id) {

    fetch(`${BASE_URL}/leave/approve/${id}`, {
        method:"PUT"
    })

    .then(response => response.text())

    .then(data => {
        alert(data);
        loadAllLeaves();
    });
}

function rejectLeave(id) {

    fetch(`${BASE_URL}/leave/reject/${id}`, {
        method:"PUT"
    })

    .then(response => response.text())

    .then(data => {
        alert(data);
        loadAllLeaves();
    });
}

</script>

</body>
</html>
