      /* ================= EMPLOYEE POPUP ================= */

.custom-modal{
    max-width:650px;
}

.modal-body{
    overflow-y:auto;
    max-height:70vh;
     padding:15px;
}

.modal-content{
   max-height:90vh;
    border-radius:20px;
    border:none;
    overflow:hidden;
}

.modal-header{
    padding:15px 20px;
}

/* Profile */

.profile-section{
    text-align:center;
    margin-bottom:20px;
}

.profile-section img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #e9f2ff;
}

.profile-section h2{
    font-size:22px;
    font-weight:700;
    margin-top:10px;
    margin-bottom:8px;
}

.status-badge{
    display:inline-block;
    background:#d4edda;
    color:#198754;
    padding:5px 15px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

/* Grid */

.details-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

/* Cards */

.info-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff;
    border:1px solid #eee;
    border-radius:12px;
    padding:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
}

.info-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#eef4ff;
    color:#0d6efd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    flex-shrink:0;
}

.info-title{
    font-size:11px;
    color:#6c757d;
    font-weight:600;
    margin-bottom:2px;
}

.info-value{
    font-size:14px;
    font-weight:600;
    color:#222;
    word-break:break-word;
    overflow-wrap:anywhere;
}

/* Footer */

.modal-footer-custom{
    border-top:1px solid #eee;
    margin-top:15px;
    padding-top:15px;
    text-align:right;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .custom-modal{
        max-width:95%;
        margin:10px auto;
    }

    .modal-body{
        padding:12px;
    }

    .profile-section{
        margin-bottom:15px;
    }

    .profile-section img{
        width:70px;
        height:70px;
    }

    .profile-section h2{
        font-size:18px;
    }

    .status-badge{
        font-size:11px;
        padding:4px 12px;
    }

    .details-grid{
        grid-template-columns:1fr;
        gap:8px;
    }

    .info-card{
        padding:10px;
        gap:10px;
    }

    .info-icon{
        width:35px;
        height:35px;
        font-size:14px;
    }

    .info-title{
        font-size:10px;
    }

    .info-value{
        font-size:13px;
    }

    .modal-footer-custom{
        text-align:center;
    }

    .modal-footer-custom .btn{
        width:100%;
        margin-bottom:8px;
    }
    .modal-header h4{
        font-size:16px;
        margin:0;
    }

    .btn-close{
        font-size:12px;
    }
}

<script>
  let allEmployees = [];
  let currentEmployee = null;
  let isEditMode = false;
  let hasUnsavedChanges = false;

  function loadEmployeeTable() {

    let table = document.getElementById("employeeTable");

    table.innerHTML = "";

    allEmployees.forEach(employee => {

        table.innerHTML += `
        <tr>
            <td>${employee.id}</td>
            <td>${employee.name}</td>
            <td>${employee.username}</td>
            <td>${employee.email}</td>
            <td>
                <button class="btn btn-info btn-sm"
                        onclick="viewEmployee(${employee.id})">
                    <i class="fas fa-eye"></i>
                </button>
            </td>
        </tr>
        `;

    });

}

window.onload = function () {

    fetch("/get-employees")
    .then(response => response.json())
    .then(employees => {

        employees.sort((a, b) =>
    (a.name || "").localeCompare(b.name || ""));
    allEmployees = employees;

        document.getElementById("totalEmployees").innerText =
            employees.length;

            loadEmployeeTable();

        

    });

}

</script>

if (text.includes(searchValue)) {

} else {

function editEmployee(id){

function deleteEmployee(id){

    let emp = allEmployees.find(employee => employee.id == id);

    if(!emp){
        alert("Employee not found.");
        return;
    }

    let confirmDelete = confirm(
        "Delete Employee?\n\n" +
        "Employee Name : " + emp.name +
        "\n\nThis action cannot be undone."
    );

    if(!confirmDelete){
        return;
    }

    // Backend API next step me call karenge

    fetch("/employee/" + id, {

    method: "DELETE"

})
.then(response => {

    if(!response.ok){
        throw new Error("Delete failed");
    }

    return response.text();

})
.then(message => {

    alert(message);

    // Popup Close

    bootstrap.Modal.getInstance(
        document.getElementById("employeeModal")
    ).hide();

    // Employee List Update

    allEmployees = allEmployees.filter(emp => emp.id != id);

    loadEmployeeTable();

    document.getElementById("totalEmployees").innerText =
        allEmployees.length;

})
.catch(error => {

    alert("Unable to delete employee.");

    console.error(error);

});

}

async function exportEmployeeExcel() {

    const response = await fetch("/get-employees");

    const employees = await response.json();

    let excelData = [];

    employees.forEach((emp, index) => {

        excelData.push({

            "S.N.": index + 1,

            "Employee ID": emp.id,

            "Employee Name": emp.name || "",

            "Username": emp.username || "",

            "Email": emp.email || "",

            "Mobile": emp.mobile || "",

            "Designation": emp.designation || "",

            "Reporting Manager": emp.reportingManager || "",

            "Head Quarter": emp.headquarters || "",

            "Joining Date": emp.joiningDate || ""

        });

    });

    const worksheet = XLSX.utils.json_to_sheet(excelData);

    // Column Width
