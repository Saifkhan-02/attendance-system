<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASM Payment Collection</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/asm-common.css">

  <style>
    body { background: #f4f6fb; }

    .top-header {
      background: linear-gradient(135deg, #0d4f9c, #3f7fe0);
      color: white;
      padding: 25px;
      border-radius: 0 0 25px 25px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, .15);
    }
    .back-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, .2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, .3);
    }
    .main-card, .summary-card {
      border: none;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }
    .form-control, .form-select {
      border-radius: 12px;
      padding: 12px;
    }
    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 23px;
    }
    .bg-sale { background: #dcfce7; color: #16a34a; }
    .bg-paid { background: #dbeafe; color: #2563eb; }
    .bg-due { background: #fee2e2; color: #dc2626; }
  </style>
</head>

<body>

  <div class="top-header">
    <div class="d-flex align-items-center justify-content-between">
      <button class="back-btn" onclick="window.location.href='ASMSalesPayment.html'">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="text-center flex-grow-1">
        <h2 class="fw-bold mb-1">Payment Collection</h2>
        <p class="mb-0 text-white-50">Update doctor due payments</p>
      </div>
      <div style="width:42px"></div>
    </div>
  </div>

  <div class="container py-4">

    <!-- Select Doctor -->
    <div class="card main-card mb-4">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-3">
          <i class="fa-solid fa-user-doctor me-2 text-primary"></i> Select Doctor
        </h4>
        <label class="form-label fw-bold">Doctor</label>
        <select id="doctorSelect" class="form-select" onchange="showDoctorDue()">
          <option value="">Select Doctor</option>
        </select>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4">
        <div class="card summary-card">
          <div class="card-body text-center">
            <div class="icon-box bg-sale mb-2">
              <i class="fa-solid fa-chart-line"></i>
            </div>
            <h6 class="text-muted">Total Sale</h6>
            <h3 id="totalSale" class="fw-bold">₹0</h3>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="card summary-card">
          <div class="card-body text-center">
            <div class="icon-box bg-paid mb-2">
              <i class="fa-solid fa-wallet"></i>
            </div>
            <h6 class="text-muted">Received</h6>
            <h3 id="totalPaid" class="fw-bold">₹0</h3>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card summary-card">
          <div class="card-body text-center">
            <div class="icon-box bg-due mb-2">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h6 class="text-muted">Pending Due</h6>
            <h3 id="totalDue" class="fw-bold text-danger">₹0</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Payment Form -->
    <div class="card main-card">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-4">
          <i class="fa-solid fa-money-bill-transfer me-2 text-primary"></i> Update Payment
        </h4>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Payment Mode</label>
            <select id="paymentMode" class="form-select">
              <option value="">Select Payment Mode</option>
              <option value="Cash">Cash</option>
              <option value="UPI">UPI</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Cheque">Cheque</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Received Amount</label>
            <input type="number" id="receivedAmount" class="form-control" placeholder="Enter received amount">
          </div>
          <div class="col-md-12">
            <label class="form-label fw-bold">Remarks</label>
            <textarea id="remarks" class="form-control" rows="3" placeholder="Optional remarks"></textarea>
          </div>
          <div class="col-md-12 mt-4">
            <button id="updatePaymentBtn" class="btn btn-primary w-100 py-3" onclick="updateDoctorPayment()">
              <i class="fa-solid fa-check me-2"></i> Update Payment
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/asm-common.js"></script>
  <script src="js/asm-payment-collection.js"></script>
</body>
</html>
